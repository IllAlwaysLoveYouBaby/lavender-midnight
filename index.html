
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10091c">
<title>Lavender Midnight</title>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* { box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#10091c;
}

body {
  font-family:'Cormorant Garamond',serif;
  color:white;
}

.screen {
  position:fixed;
  inset:0;
  overflow:hidden;
  isolation:isolate;
  background:#10091c;
}

.hidden { display:none !important; }

/* GALAXY BACKGROUND — PRESERVED */

.nebula-clouds {
  position:absolute;
  inset:-12%;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  opacity:1;
}

.nebula-clouds::before,
.nebula-clouds::after {
  content:"";
  position:absolute;
  inset:-8%;
  pointer-events:none;
}

.nebula-clouds::before {
  background:
    radial-gradient(ellipse 43% 28% at 18% 28%, rgba(151,105,205,.62) 0%, rgba(115,73,166,.38) 42%, transparent 76%),
    radial-gradient(ellipse 42% 31% at 76% 38%, rgba(133,101,197,.58) 0%, rgba(103,69,157,.34) 46%, transparent 76%),
    radial-gradient(ellipse 46% 30% at 48% 82%, rgba(179,119,177,.46) 0%, rgba(129,79,159,.3) 44%, transparent 78%);
  filter:blur(24px);
  animation:nebulaFloatA 34s ease-in-out infinite alternate;
}

.nebula-clouds::after {
  background:
    radial-gradient(ellipse 27% 20% at 34% 52%, rgba(202,151,203,.34) 0%, rgba(147,101,182,.22) 48%, transparent 78%),
    radial-gradient(ellipse 32% 22% at 88% 75%, rgba(119,105,195,.38) 0%, rgba(91,73,157,.2) 48%, transparent 78%),
    radial-gradient(ellipse 28% 18% at 12% 88%, rgba(166,119,191,.32) 0%, transparent 76%);
  filter:blur(30px);
  animation:nebulaFloatB 42s ease-in-out infinite alternate;
}

@keyframes nebulaFloatA {
  from { transform:translate3d(-2%,1%,0) scale(.98); }
  to { transform:translate3d(3%,-2%,0) scale(1.08); }
}

@keyframes nebulaFloatB {
  from { transform:translate3d(2%,-1%,0) rotate(-3deg); }
  to { transform:translate3d(-3%,2%,0) rotate(4deg); }
}

.nebula-ribbon {
  position:absolute;
  width:70vw;
  height:30vw;
  min-height:190px;
  border-radius:50%;
  filter:blur(32px);
  opacity:.45;
  background:radial-gradient(ellipse,rgba(157,113,197,.48),rgba(108,75,156,.2) 48%,transparent 75%);
  pointer-events:none;
}

.nebula-ribbon.one {
  left:-18%;
  top:42%;
  transform:rotate(-22deg);
}

.nebula-ribbon.two {
  right:-20%;
  top:5%;
  transform:rotate(24deg);
  opacity:.38;
}

/* BACKGROUND STARS */

.stars {
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.star {
  position:absolute;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 4px rgba(255,255,255,.9),0 0 10px rgba(213,190,255,.8);
  animation:twinkle var(--twinkle-duration,3s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}

.star.large {
  box-shadow:0 0 5px white,0 0 13px rgba(221,198,255,.95),0 0 23px rgba(177,137,255,.6);
}

@keyframes twinkle {
  0%,100% { opacity:.28; transform:scale(.75); }
  50% { opacity:1; transform:scale(1.3); }
}

.sparkle {
  position:absolute;
  width:13px;
  height:13px;
  z-index:1;
  opacity:.7;
  animation:sparklePulse 4s ease-in-out infinite;
}

.sparkle::before,
.sparkle::after {
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.95);
  border-radius:100%;
  box-shadow:0 0 9px rgba(221,201,255,.9);
}

.sparkle::before { width:2px; height:100%; }
.sparkle::after { width:100%; height:2px; }

@keyframes sparklePulse {
  0%,100% { opacity:.25; transform:scale(.7) rotate(0deg); }
  50% { opacity:.95; transform:scale(1.25) rotate(45deg); }
}

/* SHOOTING STARS */

.shooting-star {
  position:absolute;
  z-index:2;
  width:105px;
  height:1.5px;
  border-radius:50%;
  opacity:0;
  background:linear-gradient(90deg,transparent,rgba(218,195,255,.18) 25%,rgba(255,255,255,.95) 100%);
  filter:drop-shadow(0 0 5px rgba(224,203,255,.9));
  transform:rotate(-32deg);
  animation:shootingStar 7s linear infinite;
  pointer-events:none;
}

.shooting-star::after {
  content:"";
  position:absolute;
  right:0;
  top:-2px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 8px 2px rgba(227,210,255,.9);
}

@keyframes shootingStar {
  0% { opacity:0; transform:translate(0,0) rotate(-32deg); }
  5% { opacity:.95; }
  14%,100% { opacity:0; transform:translate(-260px,170px) rotate(-32deg); }
}

/* OPENING SCREEN */

#opening {
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
}

.opening-content {
  position:relative;
  z-index:5;
  width:min(90%,460px);
  text-align:center;
  padding:28px 18px;
  animation:openingAppear 2s ease both;
}

@keyframes openingAppear {
  from { opacity:0; transform:translateY(14px); }
  to { opacity:1; transform:translateY(0); }
}

.opening-eyebrow {
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(237,222,255,.78);
  margin-bottom:27px;
}

.opening-moon {
  width:45px;
  height:45px;
  margin:0 auto 22px;
  filter:drop-shadow(0 0 12px rgba(221,198,255,.8));
}

.opening-moon svg { width:100%; height:100%; }

.opening-title {
  font-family:'Allura',cursive;
  font-size:clamp(43px,11vw,66px);
  font-weight:400;
  line-height:1.05;
  color:#fff;
  text-shadow:0 0 8px rgba(255,255,255,.7),0 0 22px rgba(208,177,255,.8),0 0 42px rgba(164,116,220,.6);
  margin:0 0 16px;
}

.opening-subtitle {
  font-size:16px;
  letter-spacing:1px;
  line-height:1.6;
  color:rgba(244,234,255,.78);
  margin:0 auto 35px;
}

.open-button {
  appearance:none;
  border:1px solid rgba(230,210,255,.65);
  border-radius:40px;
  padding:13px 28px;
  background:rgba(160,122,193,.15);
  color:white;
  font-family:'Cormorant Garamond',serif;
  font-size:16px;
  letter-spacing:1.5px;
  cursor:pointer;
  box-shadow:0 0 16px rgba(178,142,224,.2),inset 0 0 14px rgba(220,199,255,.08);
  transition:.3s ease;
}

.open-button:active {
  transform:scale(.97);
  background:rgba(180,145,220,.28);
}

/* MAIN SCENE */

#main-screen { z-index:10; }

#photos {
  position:absolute;
  inset:0;
  z-index:3;
  overflow:hidden;
  pointer-events:none;
}

/*
  POLAROID FRAME

  The image dimensions are calculated from the original image dimensions
  in JavaScript. The frame is then sized around the image.

  This means portrait and landscape images retain their original proportions.
*/

.falling-photo-frame {
  position:absolute;
  top:-220px;
  left:0;
  width:var(--photo-width);
  height:var(--photo-height);
  padding:0;
  background:#fff;
  border-radius:2px;
  box-shadow:0 5px 18px rgba(0,0,0,.32),0 0 12px rgba(229,211,255,.18);
  transform:rotate(var(--rotation));
  animation:photoFall var(--fall-duration) linear forwards;
  will-change:transform;
  overflow:hidden;
}

.falling-photo-image {
  position:absolute;
  left:7px;
  top:7px;
  width:var(--image-width);
  height:var(--image-height);
  display:block;
  object-fit:contain;
  object-position:center;
  background:#fff;
  border:0;
  padding:0;
  margin:0;
}

/* CELESTIAL POLAROID DECORATIONS */

.photo-decoration-layer {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:hidden;
}

.frame-moon {
  position:absolute;
  bottom:4px;
  left:9px;
  width:17px;
  height:17px;
  filter:drop-shadow(0 0 3px rgba(172,139,210,.3));
}

.frame-moon.right {
  left:auto;
  right:9px;
  width:15px;
  height:15px;
  bottom:5px;
}

.frame-moon svg {
  display:block;
  width:100%;
  height:100%;
}

.frame-moon path {
  fill:#b49aca;
}

.frame-star {
  position:absolute;
  display:block;
  color:#a88bbf;
  line-height:1;
  font-family:Georgia,serif;
  user-select:none;
  text-shadow:0 0 3px rgba(176,145,207,.35);
}

.frame-star.tiny { font-size:6px; opacity:.78; }
.frame-star.small { font-size:8px; opacity:.88; }
.frame-star.medium { font-size:10px; opacity:.95; }
.frame-star.bright { font-size:12px; opacity:1; }

.frame-star.top-left {
  top:1px;
  left:12px;
}

.frame-star.top-right {
  top:1px;
  right:12px;
}

.frame-star.bottom-center {
  bottom:7px;
  left:50%;
  transform:translateX(-50%);
}

.frame-star.bottom-left {
  bottom:5px;
  left:34px;
}

.frame-star.bottom-right {
  bottom:5px;
  right:34px;
}

.frame-sparkle {
  position:absolute;
  width:8px;
  height:8px;
  opacity:.85;
}

.frame-sparkle::before,
.frame-sparkle::after {
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:#b49aca;
  transform:translate(-50%,-50%);
  border-radius:2px;
}

.frame-sparkle::before {
  width:1px;
  height:100%;
}

.frame-sparkle::after {
  width:100%;
  height:1px;
}

.frame-sparkle.top-mid {
  top:0;
  left:50%;
  transform:translateX(-50%);
}

.frame-sparkle.bottom-mid {
  bottom:6px;
  left:50%;
  transform:translateX(-50%);
}

/* MESSAGE AND HEART — RESTORED TO ONE LINE */

.center-message {
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:calc(100% - 24px);
  max-width:520px;
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
  pointer-events:none;
}

.message-text {
  font-family:'Allura',cursive;
  font-size:clamp(25px,7.1vw,48px);
  font-weight:400;
  line-height:1.12;
  white-space:nowrap;
  color:#fff;
  flex:0 1 auto;
  text-shadow:0 0 5px rgba(255,255,255,.95),0 0 14px rgba(224,207,255,.95),
    0 0 28px rgba(184,145,237,.85),0 0 48px rgba(155,112,216,.55);
}

.message-heart {
  display:block;
  flex:0 0 auto;
  width:23px;
  height:23px;
  margin:0;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.95)) drop-shadow(0 0 13px rgba(211,187,255,.9));
}

.message-heart path { fill:#fff; }

/* PHOTO FALL ANIMATION */

@keyframes photoFall {
  0% {
    transform:translate3d(0,-220px,0) rotate(var(--rotation));
  }
  100% {
    transform:translate3d(var(--drift),calc(100vh + 270px),0) rotate(calc(var(--rotation) + var(--spin)));
  }
}

/* MOBILE */

@media (max-width:600px) {
  .message-text {
    font-size:clamp(20px,6.4vw,27px);
  }

  .message-heart {
    width:19px;
    height:19px;
  }

  .center-message {
    gap:4px;
  }

  .opening-subtitle { font-size:15px; }

  .nebula-clouds::before { filter:blur(19px); }
  .nebula-clouds::after { filter:blur(23px); }
}

@media (max-width:350px) {
  .message-text { font-size:20px; }
  .message-heart { width:17px; height:17px; }
}

@media (prefers-reduced-motion:reduce) {
  .nebula-clouds::before,
  .nebula-clouds::after,
  .star,
  .sparkle,
  .shooting-star {
    animation-duration:1ms !important;
  }
}
</style>
</head>

/* BACKGROUND STARS */

function createStars(containerId,count) {
  const container = document.getElementById(containerId);
  if (!container) return;

  for (let i=0; i<count; i++) {
    const star = document.createElement("span");
    star.className = "star";

    const size = Math.random() < .12
      ? 3 + Math.random()*1.5
      : 1 + Math.random()*1.5;

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random()*100 + "%";
    star.style.top = Math.random()*100 + "%";
    star.style.setProperty("--twinkle-duration",(2+Math.random()*4)+"s");
    star.style.setProperty("--delay",(Math.random()*5)+"s");

    if (size > 3) star.classList.add("large");
    container.appendChild(star);
  }

  const sparkleCount = Math.floor(count/24);

  for (let i=0; i<sparkleCount; i++) {
    const sparkle = document.createElement("span");
    sparkle.className = "sparkle";
    sparkle.style.left = Math.random()*100 + "%";
    sparkle.style.top = Math.random()*100 + "%";
    sparkle.style.animationDelay = Math.random()*5 + "s";
    container.appendChild(sparkle);
  }
}

createStars("main-stars",175);

/* CELESTIAL POLAROID BORDER DESIGNS */

const crescentMoon = `
<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M18.9 3.2C13.2 3.4 8.7 8.1 8.7 13.8c0 3.1 1.4 5.8 3.7 7.6-5.7-.2-10.2-4.9-10.2-10.6C2.2 5 6.9.3 12.7.3c2.4 0 4.6.8 6.2 2.1Z"/>
</svg>`;

const frameDecorations = [
  `
  <span class="frame-moon">${crescentMoon}</span>
  <span class="frame-star bright top-left">✦</span>
  <span class="frame-star small top-right">✧</span>
  <span class="frame-star tiny bottom-center">✧</span>
  <span class="frame-sparkle top-mid"></span>
  <span class="frame-sparkle bottom-mid"></span>
  `,
  `
  <span class="frame-moon right">${crescentMoon}</span>
  <span class="frame-star medium top-left">✧</span>
  <span class="frame-star bright top-right">✦</span>
  <span class="frame-star small bottom-center">✦</span>
  <span class="frame-sparkle top-mid"></span>
  <span class="frame-sparkle bottom-mid"></span>
  `,
  `
  <span class="frame-moon">${crescentMoon}</span>
  <span class="frame-star small top-left">✧</span>
  <span class="frame-star medium top-right">✦</span>
  <span class="frame-star bright bottom-center">✧</span>
  <span class="frame-sparkle top-mid"></span>
  `
];

/* PHOTO DECK — SHUFFLED WITHOUT REPEATS */

let photoDeck = [];
let photoDeckIndex = 0;

function shuffleArray(array) {
  const result = [...array];

  for (let i=result.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [result[i],result[j]] = [result[j],result[i]];
  }

  return result;
}

function refillPhotoDeck() {
  photoDeck = shuffleArray(
    photoFiles.filter(file => !unavailablePhotos.has(file))
  );
  photoDeckIndex = 0;
}

function nextPhoto() {
  if (photoDeckIndex >= photoDeck.length) {
    refillPhotoDeck();
  }

  return photoDeck[photoDeckIndex++];
}

refillPhotoDeck();

const photosContainer = document.getElementById("photos");
let activePhotoCount = 0;

/*
  RANDOM PHOTO SIZES

  These are maximum image-area dimensions, not fixed card dimensions.
  Each photo is scaled proportionally within its selected size.
*/

const photoSizes = [
  [64,78],
  [72,88],
  [80,98],
  [88,108],
  [96,118],
  [104,128]
];

function createFallingPhoto(attempt=0) {
  if (activePhotoCount >= 13) return;

  const filename = nextPhoto();
  if (!filename) return;

  const frame = document.createElement("div");
  const image = document.createElement("img");
  const decoration = document.createElement("div");

  const size = photoSizes[Math.floor(Math.random()*photoSizes.length)];
  const maxImageWidth = size[0];
  const maxImageHeight = size[1];

  const rotation = -16 + Math.random()*32;
  const drift = -65 + Math.random()*130;
  const spin = -12 + Math.random()*24;
  const duration = 35 + Math.random()*10;
  const design = Math.floor(Math.random()*frameDecorations.length);

  frame.className = "falling-photo-frame";

  frame.style.setProperty("--rotation",rotation+"deg");
  frame.style.setProperty("--drift",drift+"px");
  frame.style.setProperty("--spin",spin+"deg");
  frame.style.setProperty("--fall-duration",duration+"s");

  image.className = "falling-photo-image";
  image.alt = "";
  image.draggable = false;
  image.decoding = "async";

  decoration.className = "photo-decoration-layer";
  decoration.setAttribute("aria-hidden","true");
  decoration.innerHTML = frameDecorations[design];

  image.onload = () => {
    /*
      Calculate the image's actual aspect ratio.
      Fit it inside the selected maximum dimensions without cropping.
    */

    const naturalWidth = image.naturalWidth;
    const naturalHeight = image.naturalHeight;

    if (!naturalWidth || !naturalHeight) {
      image.onerror();
      return;
    }

    const scale = Math.min(
      maxImageWidth / naturalWidth,
      maxImageHeight / naturalHeight
    );

    const imageWidth = Math.max(1,naturalWidth * scale);
    const imageHeight = Math.max(1,naturalHeight * scale);

    const frameWidth = imageWidth + 14;
    const frameHeight = imageHeight + 32;

    image.style.setProperty("--image-width",imageWidth+"px");
    image.style.setProperty("--image-height",imageHeight+"px");

    frame.style.setProperty("--image-width",imageWidth+"px");
    frame.style.setProperty("--image-height",imageHeight+"px");
    frame.style.setProperty("--photo-width",frameWidth+"px");
    frame.style.setProperty("--photo-height",frameHeight+"px");

    const availableWidth = Math.max(0,window.innerWidth-frameWidth);
    const left = Math.random()*availableWidth;

    frame.style.left = left+"px";

    photosContainer.appendChild(frame);
    activePhotoCount++;

    frame.addEventListener("animationend",() => {
      frame.remove();
      activePhotoCount = Math.max(0,activePhotoCount-1);
    },{once:true});
  };

  image.onerror = () => {
    frame.remove();

    /*
      Retry using the existing retry limit.
      Failed images do not count as active photos.
    */
    if (attempt < 2) {
      createFallingPhoto(attempt+1);
    }
  };

  image.src = "./"+encodeURIComponent(filename);
}

/* PHOTO TIMING — PRESERVED */

let photoTimersStarted = false;

function startPhotos() {
  if (photoTimersStarted) return;

  photoTimersStarted = true;

  createFallingPhoto();

  setTimeout(createFallingPhoto,1500);
  setTimeout(createFallingPhoto,3000);
  setTimeout(createFallingPhoto,8000);

  setInterval(createFallingPhoto,5000);
}

/* HIDDEN YOUTUBE PLAYER — PRESERVED */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubeReady = false;
let musicRequested = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player",{
    height:"1",
    width:"1",
    videoId:videoId,

    playerVars:{
      autoplay:0,
      controls:0,
      disablekb:1,
      fs:0,
      playsinline:1,
      loop:1,
      playlist:videoId,
      modestbranding:1,
      rel:0
    },

    events:{
      onReady:function(event) {
        youtubeReady = true;

        if (musicRequested) {
          event.target.playVideo();
        }
      },

      onStateChange:function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.seekTo(0);
          event.target.playVideo();
        }
      }
    }
  });
}

(function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag,firstScript);
})();

/* OPENING BUTTON */

document.getElementById("open-button").addEventListener("click",function() {
  musicRequested = true;

  if (youtubeReady && youtubePlayer) {
    youtubePlayer.playVideo();
  }

  document.getElementById("opening").classList.add("hidden");
  document.getElementById("main-screen").classList.remove("hidden");

  startPhotos();
});
</script>
