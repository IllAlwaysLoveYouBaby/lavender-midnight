
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavender Midnight</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Nunito', sans-serif;
  color: white;
  background: linear-gradient(180deg, #92758f, #705b78 48%, #483d59);
}

/* OPENING SCREEN */
#opening {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 25%, #b493b1 0%, transparent 58%),
    linear-gradient(180deg, #967b96 0%, #705c7a 55%, #51445f 100%);
  transition: opacity 1.2s ease, visibility 1.2s ease;
}

#opening.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 4px;
  font-weight: 600;
  margin-bottom: 24px;
  opacity: .9;
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(3.2rem, 12vw, 5.5rem);
  font-weight: 400;
  line-height: 1.05;
  text-shadow: 0 0 20px rgba(255,255,255,.35);
}

.subtitle {
  font-size: 13px;
  letter-spacing: 1px;
  margin-top: 18px;
  opacity: .9;
}

.open-button {
  margin-top: 42px;
  padding: 13px 28px;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 30px;
  background: rgba(255,255,255,.12);
  color: white;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.25);
}

/* MAIN EXPERIENCE */
#main {
  position: fixed;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.8s ease;
  background:
    radial-gradient(ellipse at 50% 25%, #987c9b 0%, transparent 55%),
    linear-gradient(180deg, #806983 0%, #62516f 55%, #433a54 100%);
}

#main.visible { opacity: 1; }

/* STARS */
#stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: white;
  opacity: .5;
  box-shadow: 0 0 7px 2px rgba(255,255,255,.35);
  animation: twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: .95; transform: scale(1.35); }
}

/* CRESCENT MOON */
.moon {
  position: absolute;
  top: 8%;
  right: 12%;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #f5e9f4;
  box-shadow: 0 0 24px rgba(255,240,255,.5);
  opacity: .85;
  z-index: 1;
}

.moon::after {
  content: "";
  position: absolute;
  top: -7px;
  left: 14px;
  width: 47px;
  height: 47px;
  border-radius: 50%;
  background: #89708d;
}

/* CENTER MESSAGE */
#message {
  position: absolute;
  z-index: 5;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 96%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: .12em;
  white-space: nowrap;
  font-family: 'Allura', cursive;
  font-size: clamp(1.35rem, 6.5vw, 4.2rem);
  font-weight: 400;
  color: #fff;
  text-shadow:
    0 0 8px rgba(255,255,255,.75),
    0 0 22px rgba(255,255,255,.4);
  pointer-events: none;
}

#message-text { white-space: nowrap; }

/* SOLID WHITE SVG HEART */
.white-heart {
  display: inline-block;
  flex: 0 0 auto;
  width: .53em;
  height: .53em;
  fill: #ffffff;
  overflow: visible;
  filter: drop-shadow(0 0 5px rgba(255,255,255,.65));
}

/* FALLING PHOTOS */
#photos {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}

.falling-photo {
  position: absolute;
  top: -45px;

  /* Identical card dimensions */
  width: 85px;
  height: 105px;

  /* Fill every photo card consistently */
  object-fit: cover;
  object-position: center;

  padding: 4px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 3px;
  background: #ffffff;
  box-shadow: 0 4px 18px rgba(20,10,30,.25);

  opacity: 0;
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform, opacity;
}

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,0,0) rotate(var(--rotation));
  }

  3% { opacity: .85; }

  85% { opacity: .8; }

  100% {
    opacity: 0;
    transform:
      translate3d(var(--drift),115vh,0)
      rotate(calc(var(--rotation) + 35deg));
  }
}

/* MUSIC */
#music-area {
  position: absolute;
  z-index: 7;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  width: 220px;
}

#music-player {
  width: 190px;
  height: 107px;
  border-radius: 8px;
  overflow: hidden;
  opacity: .82;
  box-shadow: 0 3px 18px rgba(20,10,30,.25);
  background: rgba(255,255,255,.08);
}

#music-player iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#play-song {
  padding: 7px 17px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 20px;
  background: rgba(255,255,255,.12);
  color: white;
  font-family: 'Nunito', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
}

#music-note {
  max-width: 215px;
  text-align: center;
  font-size: 9px;
  line-height: 1.4;
  letter-spacing: .3px;
  color: rgba(255,255,255,.85);
}

/* SMALL SCREENS */
@media (max-width: 380px) {
  #message {
    font-size: clamp(1.25rem, 6.2vw, 2.2rem);
  }

  #music-player {
    width: 160px;
    height: 90px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .star { animation: none; }
}
</style>
</head>

<body>

<!-- OPENING SCREEN -->
<div id="opening">
  <div class="eyebrow">A LITTLE MOMENT, JUST FOR YOU</div>
  <div class="opening-title">Under the Shooting Stars</div>
  <div class="subtitle">Some things are worth taking a moment for...</div>
  <button class="open-button" id="openButton">Open Your Surprise ♡</button>
</div>

<!-- MAIN SCREEN -->
<main id="main">
  <div id="stars"></div>
  <div class="moon"></div>
  <div id="photos"></div>

  <div id="message">
    <span id="message-text">I'll Always Choose You</span>
    <svg class="white-heart" viewBox="0 0 24 24" aria-label="White heart" role="img">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
      2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
      C13.09 3.81 14.76 3 16.5 3
      19.58 3 22 5.42 22 8.5
      c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>

  <div id="music-area">
    <div id="music-player"></div>
    <button id="play-song" type="button">Play Song ♫</button>
    <div id="music-note">
      The song is set to start when you open the surprise.
      If your iPhone blocks playback, tap Play here.
    </div>
  </div>
</main>

<script>

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const photos = document.getElementById("photos");

let photoDeck = [];
let lastPhoto = null;
let photoTimer = null;
let player = null;
let playerReady = false;
let musicRequested = false;

/* STARS */

function makeStars() {
  const container = document.getElementById("stars");

  for (let i = 0; i < 85; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";
    container.appendChild(star);
  }
}

/* SHUFFLE */

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function getNextPhoto() {
  if (photoDeck.length === 0) {
    photoDeck = shuffle(photoFiles);

    if (photoDeck.length > 1 && photoDeck[0] === lastPhoto) {
      [photoDeck[0], photoDeck[1]] =
        [photoDeck[1], photoDeck[0]];
    }
  }

  lastPhoto = photoDeck.shift();
  return lastPhoto;
}

/* FALLING PHOTOS */

function createFallingPhoto() {
  const filename = getNextPhoto();
  const img = document.createElement("img");

  /* Random rotation and drift.
     Uniform card size and slower falling speed. */
  const rotation = -16 + Math.random() * 32;
  const duration = 12 + Math.random() * 6;
  const drift = -65 + Math.random() * 130;

  img.className = "falling-photo";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  img.style.left = (3 + Math.random() * 88) + "%";
  img.style.setProperty("--rotation", rotation + "deg");
  img.style.setProperty("--fall-duration", duration + "s");
  img.style.setProperty("--drift", drift + "px");

  img.onload = () => {
    photos.appendChild(img);
  };

  img.onerror = () => {
    img.remove();
    console.warn("Skipping unavailable photo:", filename);
  };

  img.src = "./" + encodeURIComponent(filename);

  img.addEventListener("animationend", () => {
    img.remove();
  });
}

/* PHOTO STARTUP */

function startPhotos() {
  if (photoTimer) return;

  createFallingPhoto();

  setTimeout(createFallingPhoto, 400);
  setTimeout(createFallingPhoto, 800);
  setTimeout(createFallingPhoto, 1200);
  setTimeout(createFallingPhoto, 1600);

  photoTimer = setInterval(createFallingPhoto, 1900);
}

/* YOUTUBE PLAYER */

function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) {
    createYouTubePlayer();
    return;
  }

  window.onYouTubeIframeAPIReady = createYouTubePlayer;

  if (!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    tag.async = true;
    document.head.appendChild(tag);
  }
}

function createYouTubePlayer() {
  if (player) return;

  player = new YT.Player("music-player", {
    width: "190",
    height: "107",
    videoId: "yLZoVTayvxY",
    playerVars: {
      autoplay: 0,
      controls: 1,
      playsinline: 1,
      modestbranding: 1,
      rel: 0,
      loop: 1,
      playlist: "yLZoVTayvxY"
    },
    events: {
      onReady: function(event) {
        playerReady = true;
        event.target.setVolume(100);

        if (musicRequested) {
          playMusic();
        }
      },
      onError: function(event) {
        console.warn("YouTube player error:", event.data);
      }
    }
  });
}

function playMusic() {
  if (!playerReady || !player) return;

  try {
    player.unMute();
    player.setVolume(100);
    player.playVideo();
  } catch (error) {
    console.warn("Playback could not start:", error);
  }
}

/* OPEN SURPRISE */

document.getElementById("openButton").addEventListener("click", () => {
  musicRequested = true;

  if (playerReady) {
    playMusic();
  }

  opening.classList.add("hidden");
  main.classList.add("visible");

  startPhotos();

  if (!player) {
    loadYouTubeAPI();
  }
});

/* BACKUP MUSIC BUTTON */

document.getElementById("play-song").addEventListener("click", () => {
  musicRequested = true;

  if (playerReady) {
    playMusic();
  } else {
    loadYouTubeAPI();
  }
});

/* INITIALIZE */

makeStars();
loadYouTubeAPI();

</script>
