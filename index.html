
<!DOCTYPE html>

<meta charset="UTF-8">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #10091b;
}

body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

/* =========================================
   DARK LAVENDER MIDNIGHT GALAXY BACKGROUND
   ========================================= */

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(105,72,139,.45), transparent 42%),
    radial-gradient(ellipse at 15% 15%, rgba(93,53,126,.38), transparent 40%),
    radial-gradient(ellipse at 85% 75%, rgba(81,48,116,.35), transparent 43%),
    radial-gradient(ellipse at 50% 100%, rgba(55,30,81,.55), transparent 48%),
    linear-gradient(145deg, #100719 0%, #21112f 38%, #160d24 72%, #0c0715 100%);
}

/* Soft nebula clouds */

.screen::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -20%;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 22% 28%, rgba(151,105,185,.30) 0%, transparent 24%),
    radial-gradient(ellipse at 72% 22%, rgba(113,77,157,.25) 0%, transparent 28%),
    radial-gradient(ellipse at 45% 58%, rgba(132,86,168,.23) 0%, transparent 30%),
    radial-gradient(ellipse at 80% 76%, rgba(111,72,151,.25) 0%, transparent 25%),
    radial-gradient(ellipse at 15% 82%, rgba(90,55,129,.24) 0%, transparent 28%),
    radial-gradient(ellipse at 55% 10%, rgba(172,124,202,.12) 0%, transparent 35%);
  filter: blur(28px);
  animation: nebulaDrift 35s ease-in-out infinite alternate;
}

.screen::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  opacity: .42;
  background:
    radial-gradient(ellipse at 10% 45%, rgba(190,148,220,.12), transparent 22%),
    radial-gradient(ellipse at 90% 35%, rgba(165,119,206,.13), transparent 25%),
    radial-gradient(ellipse at 50% 90%, rgba(116,78,164,.15), transparent 30%);
  filter: blur(35px);
}

@keyframes nebulaDrift {
  0% { transform: translate3d(-2%, -1%, 0) scale(1); }
  100% { transform: translate3d(2%, 2%, 0) scale(1.08); }
}

/* =========================================
   BACKGROUND STARS
   ========================================= */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 4px rgba(255,255,255,.9),
    0 0 9px rgba(220,195,255,.7);
  animation: twinkle 3s ease-in-out infinite;
}

.star.bright {
  width: 3px;
  height: 3px;
  box-shadow:
    0 0 5px white,
    0 0 12px rgba(235,215,255,.95),
    0 0 20px rgba(190,150,255,.6);
}

@keyframes twinkle {
  0%, 100% {
    opacity: .22;
    transform: scale(.7);
  }
  50% {
    opacity: 1;
    transform: scale(1.6);
  }
}

/* =========================================
   SHOOTING STARS
   ========================================= */

.shooting-star {
  position: absolute;
  z-index: 1;
  width: 155px;
  height: 1.5px;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    rgba(255,255,255,1)
  );
  transform: rotate(-35deg);
  transform-origin: right center;
  opacity: 0;
  filter: drop-shadow(0 0 4px white);
  animation: shooting 8s ease-in infinite;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 0;
  top: -2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 7px 2px white,
    0 0 15px 4px rgba(215,185,255,.8);
}

@keyframes shooting {
  0% {
    transform: translate3d(0,0,0) rotate(-35deg);
    opacity: 0;
  }
  4% { opacity: 1; }
  13% { opacity: 0; }
  100% {
    transform: translate3d(-650px,420px,0) rotate(-35deg);
    opacity: 0;
  }
}

/* =========================================
   OPENING SCREEN
   ========================================= */

#opening {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.5s ease;
}

.opening-content {
  position: relative;
  z-index: 2;
  padding: 25px;
  width: 100%;
  max-width: 500px;
}

.opening-eyebrow {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  margin-bottom: 30px;
}

.moon {
  font-size: 50px;
  margin-bottom: 15px;
  filter: drop-shadow(0 0 15px rgba(255,255,255,.45));
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(48px, 13vw, 76px);
  line-height: 1.1;
  font-weight: 400;
  color: #fff;
  text-shadow:
    0 0 12px rgba(255,255,255,.4),
    0 0 28px rgba(190,150,255,.4);
}

.opening-subtitle {
  margin-top: 18px;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 1px;
  color: rgba(255,255,255,.85);
}

.open-button {
  margin-top: 40px;
  padding: 15px 28px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 40px;
  background: rgba(255,255,255,.08);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: background .3s ease, transform .3s ease;
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.18);
}

/* =========================================
   MAIN SCREEN AND FALLING PHOTOS
   ========================================= */

#main {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

#photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

.falling-photo-frame {
  position: absolute;
  top: -160px;
  opacity: 0;
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform;
}

/* White Polaroid frame */

.falling-photo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  border: 6px solid white;
  outline: none;
  padding: 5px;
  background: white;
  border-radius: 3px;
  box-shadow:
    0 4px 18px rgba(10,4,20,.35),
    0 0 12px rgba(210,185,255,.12);
}

/* =========================================
   MOCKUP-STYLE CELESTIAL POLAROID DECORATIONS
   CRESCENT MOONS, FOUR-POINT STARS, SPARKLES
   NO CONSTELLATIONS OR CONNECTING LINES
   ========================================= */

.photo-decoration-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}

.frame-decoration {
  position: absolute;
  display: block;
  pointer-events: none;
  overflow: visible;
  filter: drop-shadow(0 0 2px rgba(167,128,210,.35));
}

/* Main four-point stars */

.frame-star {
  width: 15px;
  height: 15px;
  fill: #9b79c5;
  opacity: .96;
}

/* Smaller delicate sparkles */

.frame-sparkle {
  width: 9px;
  height: 9px;
  fill: #b69bd5;
  opacity: .9;
}

/* Tiny accent stars */

.frame-tiny-star {
  width: 6px;
  height: 6px;
  fill: #a98acb;
  opacity: .82;
}

/* Larger crescent moons */

.frame-moon {
  width: 24px;
  height: 24px;
  fill: #a783ce;
  opacity: .98;
  filter:
    drop-shadow(0 0 2px rgba(167,128,210,.55))
    drop-shadow(0 0 5px rgba(167,128,210,.25));
}

/* Falling animation */

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,-10px,0) rotate(var(--rotation));
  }
  3% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift),110vh,0)
      rotate(calc(var(--rotation) + 25deg));
  }
}

/* =========================================
   CENTER MESSAGE AND GLOWING HEART
   ========================================= */

.center-message {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  padding: 0 9px;
  text-align: center;
  white-space: nowrap;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  pointer-events: none;

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(43px, 11.5vw, 76px);
  line-height: 1;
  font-weight: 400;
  color: white;
  text-shadow:
    0 0 2px #ffffff,
    0 0 5px #ffffff,

    0 0 24px rgba(255,255,255,.95),
    0 0 40px rgba(224,195,255,.9),
    0 0 65px rgba(190,145,255,.8),
    0 0 95px rgba(160,110,255,.55);
}

.white-heart {
  width: clamp(34px, 8.5vw, 58px);
  height: auto;
  flex-shrink: 0;
  fill: white;
  filter:
    drop-shadow(0 0 2px #ffffff)
    drop-shadow(0 0 6px #ffffff)

    drop-shadow(0 0 25px rgba(255,255,255,.95))
    drop-shadow(0 0 42px rgba(220,185,255,.9))
    drop-shadow(0 0 65px rgba(185,135,255,.75));

/* =========================================
   HIDDEN YOUTUBE PLAYER
   ========================================= */

#youtube-player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -10000px;
  top: -10000px;

  pointer-events: none;

#youtube-player-container iframe {

/* SMALL SCREENS */

@media (max-width: 380px) {
  .opening-subtitle { font-size: 17px; }

    letter-spacing: 4px;
  }

    font-size: clamp(39px, 10.5vw, 48px);
  }

  .white-heart {
    width: clamp(29px, 7.5vw, 36px);
  }
}

/* =========================================
   CREATE BACKGROUND STARS
   ========================================= */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");

    star.className = Math.random() < 0.13
      ? "star bright"
      : "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 6 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";

    container.appendChild(star);
  }
}

/* =========================================
   PHOTO SHUFFLE / NO REPEATS
   ========================================= */

const photos = document.getElementById("photos");

let photoDeck = [];
let lastDisplayedPhoto = null;
let failedPhotos = new Set();
let photoStarted = false;
let photoTimer = null;
let pendingPhotos = 0;

/* THESE TWO FILES FAILED THE PHOTO CHECKER */

const unavailablePhotos = new Set([
  "IMG_4101_Original.jpeg",
  "wedding-photo-12.png"
]);

/* RETRY TEMPORARY LOADING FAILURES */

const photoRetryCounts = new Map();
const MAX_PHOTO_RETRIES = 2;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function startNewPhotoCycle() {
  const availablePhotos = photoFiles.filter(
    filename =>
      !unavailablePhotos.has(filename) &&
      !failedPhotos.has(filename)
  );

  photoDeck = shuffle(availablePhotos);

  if (
    photoDeck.length > 1 &&
    photoDeck[0] === lastDisplayedPhoto
  ) {
    [photoDeck[0], photoDeck[1]] =
      [photoDeck[1], photoDeck[0]];
  }

  photoRetryCounts.clear();

  console.log(
    "Starting photo cycle with",
    photoDeck.length,
    "available photos."
  );
}

function getNextPhoto() {
  if (photoDeck.length === 0) {
    if (pendingPhotos > 0) return null;
    startNewPhotoCycle();
  }

  if (photoDeck.length === 0) return null;

  return photoDeck.shift();
}

/* =========================================

function getRandomPhotoSize() {
  const sizes = [
    { width: 78, height: 98 },
    { width: 88, height: 110 },
    { width: 98, height: 122 },
    { width: 108, height: 135 },
    { width: 118, height: 148 },
    { width: 128, height: 160 }
  ];

  const selected = sizes[
    Math.floor(Math.random() * sizes.length)
  ];

  const maxWidth = Math.max(70, window.innerWidth - 20);
  const scale = Math.min(1, maxWidth / selected.width);

  return {
    width: Math.round(selected.width * scale),
    height: Math.round(selected.height * scale)
  };
}

    "http://www.w3.org/2000/svg",
    "svg"
  );

  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");

  svg.classList.add("frame-decoration", type);

  if (type === "frame-moon") {
    svg.innerHTML = moonShape;
  } else if (type === "frame-sparkle") {
    svg.innerHTML = sparkleShape;
  } else {
    svg.innerHTML = starShape;
  }

  Object.assign(svg.style, position);
  layer.appendChild(svg);
}

function addPhotoDecorations(layer) {

  /*
    Each frame receives its own randomized arrangement.
    All decorations stay near the white border.
    No connecting lines, constellation patterns, or
    decorations across the photo itself.
  */

  const corners = [
    { top: "4px", left: "4px" },
    { top: "4px", right: "4px" },
    { bottom: "4px", left: "4px" },
    { bottom: "4px", right: "4px" }
  ];

  const edgePositions = [
    { top: "5px", left: "38%" },
    { top: "5px", right: "38%" },
    { bottom: "5px", left: "38%" },
    { bottom: "5px", right: "38%" },
    { top: "40%", left: "5px" },
    { top: "40%", right: "5px" },
    { bottom: "30%", left: "5px" },
    { bottom: "30%", right: "5px" }
  ];

  const selectedMoonCorner =
    Math.floor(Math.random() * corners.length);

  /* Most frames receive one large crescent moon */

  if (Math.random() < 0.72) {
    addDecoration(
      layer,
      "frame-moon",
      corners[selectedMoonCorner]
    );
  }

  /* Main prominent stars */

  const starPositions = shuffle([
    ...corners.filter((_, index) => index !== selectedMoonCorner),
    ...edgePositions
  ]);

  const starCount = 3 + Math.floor(Math.random() * 3);

  starPositions.slice(0, starCount).forEach(position => {
    addDecoration(layer, "frame-star", position);
  });

  /* Small delicate sparkles */

  const sparklePositions = shuffle(edgePositions);
  const sparkleCount = 2 + Math.floor(Math.random() * 3);

  sparklePositions.slice(0, sparkleCount).forEach(position => {
    addDecoration(layer, "frame-sparkle", position);
  });

  /* Occasional tiny accents */

  if (Math.random() < 0.65) {
    const tinyPositions = shuffle([
      { top: "17px", left: "20%" },
      { top: "17px", right: "20%" },
      { bottom: "17px", left: "20%" },
      { bottom: "17px", right: "20%" }
    ]);

    addDecoration(
      layer,
      "frame-tiny-star",
      tinyPositions[0]
    );
  }
}

/* =========================================
   CREATE FALLING PHOTO
   ========================================= */

function createFallingPhoto() {
  const filename = getNextPhoto();

  if (!filename) return;

  const frame = document.createElement("div");
  const img = document.createElement("img");
  const decorationLayer = document.createElement("div");

  const rotation = -16 + Math.random() * 32;
  const duration = 35 + Math.random() * 10;
  const drift = -65 + Math.random() * 130;
  const size = getRandomPhotoSize();

  frame.className = "falling-photo-frame";

  frame.style.width = size.width + "px";
  frame.style.height = size.height + "px";

  const availableWidth = Math.max(
    0,
    window.innerWidth - size.width
  );

  frame.style.left = (Math.random() * availableWidth) + "px";

  frame.style.setProperty("--rotation", rotation + "deg");
  frame.style.setProperty("--fall-duration", duration + "s");
  frame.style.setProperty("--drift", drift + "px");

  img.className = "falling-photo-image";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  decorationLayer.className = "photo-decoration-layer";

  addPhotoDecorations(decorationLayer);

  frame.appendChild(img);
  frame.appendChild(decorationLayer);

  pendingPhotos++;

  img.onload = () => {
    pendingPhotos--;

    photoRetryCounts.delete(filename);
    lastDisplayedPhoto = filename;

    photos.appendChild(frame);

    console.log("Photo displayed:", filename);
  };

  img.onerror = () => {
    pendingPhotos--;

    const retries = photoRetryCounts.get(filename) || 0;

    if (retries < MAX_PHOTO_RETRIES) {
      photoRetryCounts.set(filename, retries + 1);

      photoDeck.push(filename);

      console.warn(
        "Retrying photo:",
        filename,
        "Attempt:",
        retries + 1
      );
    } else {
      failedPhotos.add(filename);
      photoRetryCounts.delete(filename);

      console.warn(
        "Skipping photo after retries:",
        filename
      );
    }

    frame.remove();
  };

  frame.addEventListener("animationend", () => {
    frame.remove();
  });

  img.src = "./" + encodeURIComponent(filename);
}

/* =========================================
   PHOTO START SEQUENCE
   ========================================= */

function startPhotos() {
  if (photoStarted) return;

  photoStarted = true;

  createFallingPhoto();

  setTimeout(createFallingPhoto, 1500);
  setTimeout(createFallingPhoto, 3000);

  setTimeout(() => {
    createFallingPhoto();
    photoTimer = setInterval(createFallingPhoto, 5000);
  }, 8000);
}

/* =========================================
   HIDDEN YOUTUBE PLAYER WITH LOOPING
   ========================================= */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubePlayerReady = false;
let startMusicWhenReady = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: "200",
    height: "200",

    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: videoId
    },

    events: {
      onReady: function(event) {
        youtubePlayerReady = true;

        if (startMusicWhenReady) {
          event.target.playVideo();
          startMusicWhenReady = false;
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.playVideo();
        }
      }
    }
  });
}

/* LOAD YOUTUBE API */

(function loadYouTubeAPI() {
  const tag = document.createElement("script");

  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];

  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* =========================================
   OPEN SURPRISE
   ========================================= */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {

  /* Start the hidden song from the opening button tap */

  if (youtubePlayer && youtubePlayerReady) {
    youtubePlayer.playVideo();
  } else {
    startMusicWhenReady = true;
  }

  opening.style.opacity = "0";

  setTimeout(() => {
    opening.style.display = "none";
    main.style.display = "block";

    requestAnimationFrame(() => {
      main.style.opacity = "1";
    });

    startPhotos();
  }, 1000);
});
