
<script>

/* =========================================================
   MUSIC — YOUTUBE PLAYER
   New Video ID: WY7FS8lvB-k
========================================================= */

const videoId = "WY7FS8lvB-k";

let youtubePlayer = null;
let youtubeReady = false;
let musicRequested = false;
let playerCreationStarted = false;
let photosStarted = false;

/* =========================================================
   CREATE YOUTUBE PLAYER
========================================================= */

function createYouTubePlayer() {

  if (
    playerCreationStarted ||
    youtubePlayer ||
    !window.YT ||
    !window.YT.Player
  ) {
    return;
  }

  const playerElement = document.getElementById("youtube-player");

  if (!playerElement) {
    console.error("YouTube player container is missing.");
    return;
  }

  playerCreationStarted = true;

  youtubePlayer = new YT.Player("youtube-player", {

    height: "200",
    width: "200",

    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      loop: 1,
      playlist: videoId,
      modestbranding: 1,
      rel: 0,
      enablejsapi: 1,
      origin: window.location.origin
    },

    events: {

      /* PLAYER READY */
      onReady: function(event) {

        youtubeReady = true;

        event.target.setVolume(100);

        if (musicRequested) {
          event.target.playVideo();
        }

      },

      /* LOOP FALLBACK */
      onStateChange: function(event) {

        if (event.data === YT.PlayerState.ENDED) {
          event.target.seekTo(0);
          event.target.playVideo();
        }

      },

      /* PLAYER ERRORS */
      onError: function(event) {

        console.error("YouTube playback error:", event.data);

      }

    }

  });

}

/* =========================================================
   YOUTUBE API CALLBACK
========================================================= */

function handleYouTubeAPIReady() {
  createYouTubePlayer();
}

/* =========================================================
   LOAD YOUTUBE API
========================================================= */

(function loadYouTubeAPI() {

  /* API already loaded */
  if (window.YT && window.YT.Player) {
    createYouTubePlayer();
    return;
  }

  /* Preserve any existing callback */
  const previousCallback = window.onYouTubeIframeAPIReady;

  window.onYouTubeIframeAPIReady = function() {

    if (typeof previousCallback === "function") {
      try {
        previousCallback();
      } catch (error) {
        console.warn("Previous YouTube callback error:", error);
      }
    }

    handleYouTubeAPIReady();

  };

  /* Check for an API script already loading */
  const existingScript = document.querySelector(
    'script[src*="youtube.com/iframe_api"]'
  );

  if (existingScript) {

    existingScript.addEventListener("load", function() {
      createYouTubePlayer();
    });

    return;
  }

  /* Load API */
  const tag = document.createElement("script");

  tag.src = "https://www.youtube.com/iframe_api";
  tag.async = true;

  tag.onload = function() {
    createYouTubePlayer();
  };

  tag.onerror = function() {
    console.error("Unable to load YouTube API.");
  };

  document.head.appendChild(tag);

})();

/* =========================================================
   OPEN SURPRISE BUTTON
========================================================= */

const openButton = document.getElementById("open-button");

if (openButton) {

  openButton.addEventListener("click", function() {

    /* Remember playback request */
    musicRequested = true;

    /* Start playback directly during the user's tap */
    if (youtubeReady && youtubePlayer) {

      try {
        youtubePlayer.playVideo();
      } catch (error) {
        console.warn("Playback request failed:", error);
      }

    }

    /* Open main screen */
    const opening = document.getElementById("opening");
    const mainScreen = document.getElementById("main-screen");

    if (opening) {
      opening.classList.add("hidden");
    }

    if (mainScreen) {
      mainScreen.classList.remove("hidden");
    }

    /* Start falling photos only once */
    if (!photosStarted && typeof startPhotos === "function") {

      photosStarted = true;
      startPhotos();

    }

  });

}

</script>
