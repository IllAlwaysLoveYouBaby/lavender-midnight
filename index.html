
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10091c">
<title>Lavender Midnight</title>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #10091c;
}

body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 48%, #241333 0%, #180e25 42%, #10091c 100%);
}

.hidden {
  display: none !important;
}

/* =====================================================
   NEBULA CLOUDS
   Separate positive-z layer so they remain visible.
===================================================== */

.nebula-clouds {
  position: absolute;
  inset: -18%;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.nebula-cloud {
  position: absolute;
  display: block;
  border-radius: 50%;
  filter: blur(48px);
  mix-blend-mode: screen;
  opacity: .8;
  will-change: transform;
}

.cloud-one {
  width: 85vw;
  height: 58vw;
  min-width: 440px;
  min-height: 330px;
  left: -20%;
  top: 13%;
  background:
    radial-gradient(ellipse at 45% 50%,
      rgba(156, 105, 204, .72) 0%,
      rgba(119, 76, 169, .48) 30%,
      rgba(83, 52, 132, .25) 53%,
      transparent 74%);
  animation: cloudDriftOne 24s ease-in-out infinite alternate;
}

.cloud-two {
  width: 95vw;
  height: 62vw;
  min-width: 480px;
  min-height: 350px;
  right: -30%;
  top: 28%;
  background:
    radial-gradient(ellipse at 50% 50%,
      rgba(120, 91, 190, .66) 0%,
      rgba(105, 69, 163, .42) 32%,
      rgba(79, 48, 127, .2) 55%,
      transparent 75%);
  animation: cloudDriftTwo 29s ease-in-out infinite alternate;
}

.cloud-three {
  width: 82vw;
  height: 55vw;
  min-width: 420px;
  min-height: 310px;
  left: 12%;
  bottom: -15%;
  background:
    radial-gradient(ellipse at 50% 45%,
      rgba(180, 117, 179, .48) 0%,
      rgba(132, 80, 164, .36) 36%,
      rgba(91, 53, 135, .18) 58%,
      transparent 76%);
  animation: cloudDriftThree 32s ease-in-out infinite alternate;
}

.cloud-four {
  width: 70vw;
  height: 46vw;
  min-width: 370px;
  min-height: 270px;
  left: 25%;
  top: 4%;
  background:
    radial-gradient(ellipse at 50% 50%,
      rgba(207, 145, 190, .32) 0%,
      rgba(148, 93, 177, .29) 38%,
      transparent 73%);
  animation: cloudDriftOne 35s ease-in-out infinite alternate-reverse;
}

.cloud-five {
  width: 60vw;
  height: 45vw;
  min-width: 320px;
  min-height: 260px;
  left: -5%;
  top: 52%;
  background:
    radial-gradient(ellipse at 50% 50%,
      rgba(106, 91, 194, .45) 0%,
      rgba(102, 66, 163, .3) 40%,
      transparent 75%);
  animation: cloudDriftTwo 27s ease-in-out infinite alternate-reverse;
}

@keyframes cloudDriftOne {
  from { transform: translate(-2%, -2%) rotate(-8deg) scale(.96); }
  to { transform: translate(9%, 8%) rotate(12deg) scale(1.12); }
}

@keyframes cloudDriftTwo {
  from { transform: translate(3%, 2%) rotate(10deg) scale(1.05); }
  to { transform: translate(-9%, -6%) rotate(-12deg) scale(.94); }
}

@keyframes cloudDriftThree {
  from { transform: translate(4%, -3%) rotate(-5deg) scale(.95); }
  to { transform: translate(-6%, 5%) rotate(9deg) scale(1.1); }
}

/* =====================================================
   STAR FIELD
===================================================== */

.stars {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  box-shadow:
    0 0 4px rgba(255,255,255,.9),
    0 0 10px rgba(213,190,255,.8);
  animation: twinkle var(--twinkle-duration, 3s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

.star.large {
  box-shadow:
    0 0 5px white,
    0 0 13px rgba(221,198,255,.95),
    0 0 23px rgba(177,137,255,.6);
}

@keyframes twinkle {
  0%, 100% { opacity: .28; transform: scale(.75); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* Four-point glowing stars */

.sparkle {
  position: absolute;
  width: 13px;
  height: 13px;
  z-index: 1;
  opacity: .7;
  animation: sparklePulse 4s ease-in-out infinite;
}

.sparkle::before,
.sparkle::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,.95);
  border-radius: 100%;
  box-shadow: 0 0 9px rgba(221,201,255,.9);
}

.sparkle::before {
  width: 2px;
  height: 100%;
}

.sparkle::after {
  width: 100%;
  height: 2px;
}

@keyframes sparklePulse {
  0%, 100% { opacity: .25; transform: scale(.7) rotate(0deg); }
  50% { opacity: .95; transform: scale(1.25) rotate(45deg); }
}

/* =====================================================
   SHOOTING STARS
===================================================== */

.shooting-star {
  position: absolute;
  z-index: 2;
  width: 105px;
  height: 1.5px;
  border-radius: 50%;
  opacity: 0;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(218,195,255,.18) 25%,
    rgba(255,255,255,.95) 100%
  );
  filter: drop-shadow(0 0 5px rgba(224,203,255,.9));
  transform: rotate(-32deg);
  animation: shootingStar 7s linear infinite;
  pointer-events: none;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 0;
  top: -2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 8px 2px rgba(227,210,255,.9);
}

@keyframes shootingStar {
  0% {
    opacity: 0;
    transform: translate(0,0) rotate(-32deg);
  }
  5% { opacity: .95; }
  14% { opacity: 0; }
  100% {
    opacity: 0;
    transform: translate(-260px,170px) rotate(-32deg);
  }
}

/* =====================================================
   OPENING SCREEN
===================================================== */

#opening {
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
}

.opening-content {
  position: relative;
  z-index: 5;
  width: min(90%, 460px);
  text-align: center;
  padding: 28px 18px;
  animation: openingAppear 2s ease both;
}

@keyframes openingAppear {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.opening-eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(237,222,255,.78);
  margin-bottom: 27px;
}

.opening-moon {
  width: 45px;
  height: 45px;
  margin: 0 auto 22px;
  filter: drop-shadow(0 0 12px rgba(221,198,255,.8));
}

.opening-moon svg {
  width: 100%;
  height: 100%;
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(43px, 11vw, 66px);
  font-weight: 400;
  line-height: 1.05;
  color: #fff;
  text-shadow:
    0 0 8px rgba(255,255,255,.7),
    0 0 22px rgba(208,177,255,.8),
    0 0 42px rgba(164,116,220,.6);
  margin: 0 0 16px;
}

.opening-subtitle {
  font-size: 16px;
  letter-spacing: 1px;
  line-height: 1.6;
  color: rgba(244,234,255,.78);
  margin: 0 auto 35px;
}

.open-button {
  appearance: none;
  border: 1px solid rgba(230,210,255,.65);
  border-radius: 40px;
  padding: 13px 28px;
  background: rgba(160,122,193,.15);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow:
    0 0 16px rgba(178,142,224,.2),
    inset 0 0 14px rgba(220,199,255,.08);
  transition: .3s ease;
}

.open-button:active {
  transform: scale(.97);
  background: rgba(180,145,220,.28);
}

/* =====================================================
   MAIN SCREEN
===================================================== */

#main-screen {
  z-index: 10;
}

#photos {
  position: absolute;
  inset: 0;
  z-index: 3;
  overflow: hidden;
  pointer-events: none;
}

/* =====================================================
   POLAROID PHOTO CARDS
===================================================== */

.falling-photo-frame {
  position: absolute;
  top: -190px;
  left: 0;
  width: var(--photo-width);
  height: var(--photo-height);
  padding: 7px 7px 25px;
  background: #fff;
  border-radius: 2px;
  box-shadow:
    0 5px 18px rgba(0,0,0,.32),
    0 0 12px rgba(229,211,255,.18);
  transform: rotate(var(--rotation));
  animation: photoFall var(--fall-duration) linear forwards;
  will-change: transform;
}

.falling-photo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #eee;
  border: 0;
  padding: 0;
}

/*
  Decoration layer is deliberately larger and more expressive.
  The art stays on the white Polaroid border.
*/

.photo-decoration-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.photo-decoration-layer svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.photo-decoration-layer .ornament {
  fill: none;
  stroke: #a98acb;
  stroke-width: 1.15;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .9;
}

.photo-decoration-layer .ornament-soft {
  fill: none;
  stroke: #c2a8df;
  stroke-width: .8;
  stroke-linecap: round;
  opacity: .75;
}

.photo-decoration-layer .moon {
  fill: #b99bd8;
  opacity: .94;
  filter: drop-shadow(0 0 2px rgba(171,133,211,.4));
}

.photo-decoration-layer .star-shape {
  fill: #a98acb;
  opacity: .95;
}

.photo-decoration-layer .tiny-star {
  fill: #c4a9df;
  opacity: .95;
}

.photo-decoration-layer .streak {
  stroke: #a98acb;
  stroke-width: 1.1;
  stroke-linecap: round;
  opacity: .85;
}

.photo-decoration-layer .streak-glow {
  stroke: #d3bce9;
  stroke-width: 2.8;
  stroke-linecap: round;
  opacity: .32;
}

/* Gentle variety in the ornament composition */

.falling-photo-frame.design-1 .moon { transform: translate(0,0); }
.falling-photo-frame.design-2 .moon { transform: translate(0,0) scale(.85); }
.falling-photo-frame.design-3 .moon { transform: translate(0,0) scale(1.1); }
.falling-photo-frame.design-4 .moon { transform: translate(0,0) scale(.92); }

/* =====================================================
   CENTER MESSAGE
===================================================== */

.center-message {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 20px);
  max-width: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  pointer-events: none;
}

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(25px, 7.1vw, 48px);
  font-weight: 400;
  line-height: 1.12;
  white-space: nowrap;
  color: #fff;
  text-shadow:
    0 0 5px rgba(255,255,255,.95),
    0 0 14px rgba(224,207,255,.95),
    0 0 28px rgba(184,145,237,.85),
    0 0 48px rgba(155,112,216,.55);
}

.message-heart {
  width: 23px;
  height: 23px;
  margin-top: 12px;
  filter:
    drop-shadow(0 0 5px rgba(255,255,255,.95))
    drop-shadow(0 0 13px rgba(211,187,255,.9));
}

.message-heart path {
  fill: #fff;
}

/* =====================================================
   PHOTO FALL ANIMATION
===================================================== */

@keyframes photoFall {
  0% {
    transform:
      translate3d(0, -190px, 0)
      rotate(var(--rotation));
  }
  100% {
    transform:
      translate3d(var(--drift), calc(100vh + 240px), 0)
      rotate(calc(var(--rotation) + var(--spin)));
  }
}

@media (max-width: 600px) {
  .message-text {
    font-size: clamp(23px, 6.9vw, 27px);
  }

  .message-heart {
    width: 19px;
    height: 19px;
    margin-top: 10px;
  }

  .cloud-one,
  .cloud-two,
  .cloud-three,
  .cloud-four,
  .cloud-five {
    filter: blur(38px);
  }

  .opening-subtitle {
    font-size: 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .nebula-cloud,
  .star,
  .sparkle,
  .shooting-star {
    animation-duration: 1ms !important;
  }
}
</style>
</head>

/* =====================================================
   STAR GENERATION
===================================================== */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);
  if (!container) return;

  for (let i = 0; i < count; i++) {
    const star = document.createElement("span");
    star.className = "star";

    const size = Math.random() < .12
      ? 3 + Math.random() * 1.5
      : 1 + Math.random() * 1.5;

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.setProperty("--twinkle-duration", (2 + Math.random() * 4) + "s");
    star.style.setProperty("--delay", (Math.random() * 5) + "s");

    if (size > 3) star.classList.add("large");
    container.appendChild(star);
  }

  const sparkleCount = Math.floor(count / 24);

  for (let i = 0; i < sparkleCount; i++) {
    const sparkle = document.createElement("span");
    sparkle.className = "sparkle";
    sparkle.style.left = Math.random() * 100 + "%";
    sparkle.style.top = Math.random() * 100 + "%";
    sparkle.style.animationDelay = Math.random() * 5 + "s";
    sparkle.style.transform = "scale(" + (.55 + Math.random() * .7) + ")";
    container.appendChild(sparkle);
  }
}

/* =====================================================
   NO-REPEAT SHUFFLED PHOTO DECK
===================================================== */

let photoDeck = [];
let photoDeckIndex = 0;

function shuffleArray(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function refillPhotoDeck() {
  const usable = photoFiles.filter(file => !unavailablePhotos.has(file));
  photoDeck = shuffleArray(usable);
  photoDeckIndex = 0;
}

function nextPhoto() {
  if (photoDeckIndex >= photoDeck.length) {
    refillPhotoDeck();
  }

  return photoDeck[photoDeckIndex++];
}

/* =====================================================
   PHOTO CREATION
===================================================== */

const photosContainer = document.getElementById("photos");
const photoSizes = [
  [78, 98],
  [88, 110],
  [98, 122],
  [108, 135],
  [118, 148],
  [128, 160]
];

let activePhotoCount = 0;

function createFallingPhoto(attempt = 0) {
  if (activePhotoCount >= 13) return;

  const filename = nextPhoto();
  if (!filename) return;

  const frame = document.createElement("div");
  const image = document.createElement("img");
  const decoration = document.createElement("div");

  const size = photoSizes[Math.floor(Math.random() * photoSizes.length)];
  const width = size[0];
  const height = size[1];

  const left = Math.random() * Math.max(0, window.innerWidth - width);
  const rotation = -16 + Math.random() * 32;
  const drift = -65 + Math.random() * 130;
  const spin = -12 + Math.random() * 24;
  const duration = 35 + Math.random() * 10;
  const design = 1 + Math.floor(Math.random() * borderDesigns.length);

  frame.className = "falling-photo-frame design-" + design;
  frame.style.left = left + "px";
  frame.style.setProperty("--photo-width", width + "px");
  frame.style.setProperty("--photo-height", height + "px");
  frame.style.setProperty("--rotation", rotation + "deg");
  frame.style.setProperty("--drift", drift + "px");
  frame.style.setProperty("--spin", spin + "deg");
  frame.style.setProperty("--fall-duration", duration + "s");

  image.className = "falling-photo-image";
  image.alt = "";
  image.draggable = false;

  decoration.className = "photo-decoration-layer";
  decoration.innerHTML = borderDesigns[design - 1];

  frame.appendChild(image);
  frame.appendChild(decoration);

  image.onload = () => {
    activePhotoCount++;
    photosContainer.appendChild(frame);

    frame.addEventListener("animationend", () => {
      frame.remove();
      activePhotoCount = Math.max(0, activePhotoCount - 1);
    }, { once: true });
  };

  image.onerror = () => {
    frame.remove();

    if (attempt < 2) {
      createFallingPhoto(attempt + 1);
    }
  };

  image.src = "./" + encodeURIComponent(filename);
}

/* =====================================================
   START PHOTO FLOW
===================================================== */

let photoTimersStarted = false;

function startPhotos() {
  if (photoTimersStarted) return;
  photoTimersStarted = true;

  createFallingPhoto();

  setTimeout(createFallingPhoto, 1500);
  setTimeout(createFallingPhoto, 3000);
  setTimeout(createFallingPhoto, 8000);

  setInterval(() => {
    createFallingPhoto();
  }, 5000);
}

/* =====================================================
   YOUTUBE PLAYER
   Hidden player, looping video, same video ID.
===================================================== */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubeReady = false;
let musicRequested = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    height: "1",
    width: "1",
    videoId: videoId,
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      loop: 1,
      playlist: videoId,
      modestbranding: 1,
      rel: 0
    },
    events: {
      onReady: function(event) {
        youtubeReady = true;

        if (musicRequested) {
          event.target.playVideo();
        }
      },
      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.seekTo(0);
          event.target.playVideo();
        }
      }
    }
  });
}

(function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* =====================================================
   OPENING BUTTON
===================================================== */

const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {
  musicRequested = true;

  if (youtubeReady && youtubePlayer) {
    youtubePlayer.playVideo();
  }

  document.getElementById("opening").classList.add("hidden");
  document.getElementById("main-screen").classList.remove("hidden");

  startPhotos();
});
