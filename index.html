<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavender Midnight</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #100819;
}

body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

/* =========================================
   DARK LAVENDER MIDNIGHT NEBULA BACKGROUND
   ========================================= */

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 42%,
      #49345f 0%,
      #30203f 38%,
      #1b1028 72%,
      #0c0613 100%);
}

/* Soft nebula clouds */

.screen::before {
  content: "";
  position: absolute;
  inset: -25%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 18% 20%,
      rgba(157,112,190,.38) 0%,
      rgba(104,65,139,.20) 18%,
      transparent 43%),
    radial-gradient(ellipse at 78% 17%,
      rgba(116,78,157,.32) 0%,
      rgba(82,49,117,.18) 24%,
      transparent 48%),
    radial-gradient(ellipse at 72% 58%,
      rgba(137,91,168,.30) 0%,
      rgba(84,49,116,.16) 25%,
      transparent 48%),
    radial-gradient(ellipse at 20% 76%,
      rgba(112,73,151,.32) 0%,
      rgba(74,43,105,.17) 25%,
      transparent 48%),
    radial-gradient(ellipse at 48% 48%,
      rgba(190,143,213,.12) 0%,
      transparent 38%);
  filter: blur(38px);
  opacity: .95;
  animation: nebulaDrift 28s ease-in-out infinite alternate;
}

/* Subtle misty cloud detail */

.screen::after {
  content: "";
  position: absolute;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 30% 35%,
      rgba(205,170,226,.13) 0%,
      transparent 24%),
    radial-gradient(ellipse at 80% 75%,
      rgba(169,125,206,.13) 0%,
      transparent 28%),
    radial-gradient(ellipse at 55% 12%,
      rgba(191,153,218,.10) 0%,
      transparent 25%),
    radial-gradient(ellipse at 12% 85%,
      rgba(140,99,184,.12) 0%,
      transparent 30%);
  filter: blur(25px);
  opacity: .9;
  animation: cloudDrift 36s ease-in-out infinite alternate;
}

@keyframes nebulaDrift {
  from { transform: translate3d(-2%, -1%, 0) scale(1); }
  to   { transform: translate3d(2%, 2%, 0) scale(1.08); }
}

@keyframes cloudDrift {
  from { transform: translate3d(1%, 1%, 0) scale(1); }
  to   { transform: translate3d(-2%, -2%, 0) scale(1.1); }
}

/* =========================================
   BACKGROUND STARFIELD
   ========================================= */

.stars {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 5px 1px rgba(255,255,255,.75),
    0 0 12px rgba(213,190,255,.45);
  animation: twinkle 3s ease-in-out infinite;
}

.star.bright {
  width: 3px;
  height: 3px;
  box-shadow:
    0 0 6px 2px rgba(255,255,255,.9),
    0 0 15px 3px rgba(221,197,255,.65);
}

.star.sparkle {
  width: 4px;
  height: 4px;
  box-shadow:
    0 0 8px 3px rgba(255,255,255,.95),
    0 0 20px 5px rgba(218,185,255,.75);
}

@keyframes twinkle {
  0%, 100% {
    opacity: .2;
    transform: scale(.7);
  }
  50% {
    opacity: 1;
    transform: scale(1.5);
  }
}

/* Four-point background glimmers */

.sky-glimmer {
  position: absolute;
  z-index: 1;
  width: 12px;
  height: 12px;
  pointer-events: none;
  opacity: .85;
  animation: glimmer 4s ease-in-out infinite;
}

.sky-glimmer::before,
.sky-glimmer::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  background: rgba(255,255,255,.95);
  transform: translate(-50%, -50%);
  border-radius: 100%;
  box-shadow: 0 0 9px 2px rgba(226,204,255,.7);
}

.sky-glimmer::before {
  width: 1px;
  height: 16px;
}

.sky-glimmer::after {
  width: 16px;
  height: 1px;
}

@keyframes glimmer {
  0%, 100% { opacity: .3; transform: scale(.65); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* =========================================
   SHOOTING STARS
   ========================================= */

.shooting-star {
  position: absolute;
  z-index: 2;
  width: 150px;
  height: 2px;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12) 25%,
    rgba(255,255,255,.95) 85%,
    white
  );
  transform: rotate(-35deg);
  filter: drop-shadow(0 0 5px rgba(255,255,255,.8));
  animation: shooting 8s linear infinite;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 0;
  top: -2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 8px 3px rgba(255,255,255,.9),
    0 0 18px 5px rgba(201,165,255,.65);
}

@keyframes shooting {
  0% {
    transform: translate3d(0,0,0) rotate(-35deg);
    opacity: 0;
  }
  4% { opacity: 1; }
  12% { opacity: 0; }
  100% {
    transform: translate3d(-650px,420px,0) rotate(-35deg);
    opacity: 0;
  }
}

/* =========================================
   OPENING SCREEN
   ========================================= */

#opening {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.5s ease;
}

.opening-content {
  position: relative;
  z-index: 3;
  padding: 25px;
  width: 100%;
  max-width: 500px;
}

.opening-eyebrow {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  margin-bottom: 30px;
}

.moon {
  font-size: 50px;
  margin-bottom: 15px;
  color: #e8d8ff;
  filter: drop-shadow(0 0 15px rgba(218,190,255,.55));
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(48px, 13vw, 76px);
  line-height: 1.1;
  font-weight: 400;
  color: #fff;
  text-shadow:
    0 0 15px rgba(255,255,255,.3),
    0 0 35px rgba(203,166,255,.3);
}

.opening-subtitle {
  margin-top: 18px;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 1px;
  color: rgba(255,255,255,.85);
}

.open-button {
  margin-top: 40px;
  padding: 15px 28px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 40px;
  background: rgba(255,255,255,.08);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: background .3s ease, transform .3s ease;
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.18);
}

/* =========================================
   MAIN SCREEN AND PHOTOS
   ========================================= */

#main {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

#photos {
  position: absolute;
  inset: 0;
  z-index: 3;
  overflow: hidden;
  pointer-events: none;
}

/* Floating photo wrappers */

.falling-photo-frame {
  position: absolute;
  top: -160px;
  opacity: 0;
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform;
}

/* White Polaroid frame */

.falling-photo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  border: 6px solid white;
  outline: none;
  padding: 5px;
  background: white;
  border-radius: 3px;
  box-shadow:
    0 5px 18px rgba(0,0,0,.35),
    0 0 12px rgba(226,207,255,.08);
}

/* =========================================
   CELESTIAL POLAROID DECORATIONS

   Crescent moons, large four-point stars,
   and delicate little sparkles only.

   No constellation lines.
   No connecting dots.
   No emoji decorations.
   ========================================= */

.photo-decoration-layer {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  overflow: visible;
}

.photo-decoration-layer svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Falling photos */

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,-10px,0) rotate(var(--rotation));
  }
  3% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift),110vh,0)
      rotate(calc(var(--rotation) + 25deg));
  }
}

/* =========================================
   CENTER MESSAGE AND GLOWING HEART
   ========================================= */

.center-message {
  position: absolute;
  z-index: 6;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  padding: 0 10px;
  text-align: center;
  white-space: nowrap;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(43px, 11.5vw, 76px);
  line-height: 1;
  font-weight: 400;
  color: white;
  text-shadow:
    0 0 2px #ffffff,
    0 0 6px #ffffff,
    0 0 12px rgba(255,255,255,1),
    0 0 24px rgba(255,255,255,.95),
    0 0 40px rgba(220,190,255,.9),
    0 0 65px rgba(190,145,255,.75),
    0 0 90px rgba(170,120,255,.55);
}

.white-heart {
  width: clamp(34px, 8vw, 58px);
  height: auto;
  flex-shrink: 0;
  fill: white;
  filter:
    drop-shadow(0 0 2px #ffffff)
    drop-shadow(0 0 6px #ffffff)
    drop-shadow(0 0 13px rgba(255,255,255,1))
    drop-shadow(0 0 25px rgba(255,255,255,.95))
    drop-shadow(0 0 42px rgba(218,185,255,.9))
    drop-shadow(0 0 65px rgba(190,145,255,.7));
}

/* =========================================
   HIDDEN YOUTUBE PLAYER
   ========================================= */

#youtube-player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -10000px;
  top: -10000px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

#youtube-player-container iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

/* =========================================
   SMALL SCREENS
   ========================================= */

@media (max-width: 380px) {
  .opening-subtitle { font-size: 17px; }

  .opening-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
  }

  .center-message {
    gap: 6px;
    padding: 0 7px;
  }

  .message-text {
    font-size: clamp(39px, 10.5vw, 48px);
  }

  .white-heart {
    width: clamp(29px, 7vw, 36px);
  }
}
</style>

/* =========================================
   BACKGROUND STARS
   ========================================= */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");

    const sizeRoll = Math.random();

    if (sizeRoll > .96) {
      star.className = "star sparkle";
    } else if (sizeRoll > .82) {
      star.className = "star bright";
    } else {
      star.className = "star";
    }

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 6 + "s";
    star.style.animationDuration = (2 + Math.random() * 5) + "s";

    container.appendChild(star);
  }
}

/* =========================================
   PHOTO SHUFFLE / NO REPEATS
   ========================================= */

const photos = document.getElementById("photos");

let photoDeck = [];
let lastDisplayedPhoto = null;
let failedPhotos = new Set();
let photoStarted = false;
let photoTimer = null;
let pendingPhotos = 0;

/* THESE TWO FILES FAILED THE PHOTO CHECKER */

const unavailablePhotos = new Set([
  "IMG_4101_Original.jpeg",
  "wedding-photo-12.png"
]);

/* RETRY TEMPORARY LOADING FAILURES */

const photoRetryCounts = new Map();
const MAX_PHOTO_RETRIES = 2;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function startNewPhotoCycle() {
  const availablePhotos = photoFiles.filter(
    filename =>
      !unavailablePhotos.has(filename) &&
      !failedPhotos.has(filename)
  );

  photoDeck = shuffle(availablePhotos);

  if (
    photoDeck.length > 1 &&
    photoDeck[0] === lastDisplayedPhoto
  ) {
    [photoDeck[0], photoDeck[1]] =
      [photoDeck[1], photoDeck[0]];
  }

  photoRetryCounts.clear();

  console.log(
    "Starting photo cycle with",
    photoDeck.length,
    "available photos."
  );
}

function getNextPhoto() {
  if (photoDeck.length === 0) {
    if (pendingPhotos > 0) return null;
    startNewPhotoCycle();
  }

  if (photoDeck.length === 0) return null;

  return photoDeck.shift();
}

/* =========================================
   RANDOM PHOTO DIMENSIONS
   ========================================= */

function getRandomPhotoSize() {
  const sizes = [
    { width: 78, height: 98 },
    { width: 88, height: 110 },
    { width: 98, height: 122 },
    { width: 108, height: 135 },
    { width: 118, height: 148 },
    { width: 128, height: 160 }
  ];

  const selected = sizes[
    Math.floor(Math.random() * sizes.length)
  ];

  const maxWidth = Math.max(70, window.innerWidth - 20);
  const scale = Math.min(1, maxWidth / selected.width);

  return {
    width: Math.round(selected.width * scale),
    height: Math.round(selected.height * scale)
  };
}

/* =========================================
   CREATE FALLING PHOTO
   ========================================= */

function createFallingPhoto() {
  const filename = getNextPhoto();

  if (!filename) return;

  const frame = document.createElement("div");
  const img = document.createElement("img");
  const decorationLayer = document.createElement("div");

  const rotation = -16 + Math.random() * 32;
  const duration = 35 + Math.random() * 10;
  const drift = -65 + Math.random() * 130;
  const size = getRandomPhotoSize();

  frame.className = "falling-photo-frame";

  frame.style.width = size.width + "px";
  frame.style.height = size.height + "px";

  const availableWidth = Math.max(0, window.innerWidth - size.width);
  frame.style.left = (Math.random() * availableWidth) + "px";

  frame.style.setProperty("--rotation", rotation + "deg");
  frame.style.setProperty("--fall-duration", duration + "s");
  frame.style.setProperty("--drift", drift + "px");

  img.className = "falling-photo-image";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  decorationLayer.className = "photo-decoration-layer";

  addPhotoDecorations(decorationLayer);

  frame.appendChild(img);
  frame.appendChild(decorationLayer);

  pendingPhotos++;

  img.onload = () => {
    pendingPhotos--;

    photoRetryCounts.delete(filename);
    lastDisplayedPhoto = filename;

    photos.appendChild(frame);

    console.log("Photo displayed:", filename);
  };

  img.onerror = () => {
    pendingPhotos--;

    const retries = photoRetryCounts.get(filename) || 0;

    if (retries < MAX_PHOTO_RETRIES) {
      photoRetryCounts.set(filename, retries + 1);
      photoDeck.push(filename);

      console.warn(
        "Retrying photo:",
        filename,
        "Attempt:",
        retries + 1
      );
    } else {
      failedPhotos.add(filename);
      photoRetryCounts.delete(filename);

      console.warn(
        "Skipping photo after retries:",
        filename
      );
    }

    frame.remove();
  };

  frame.addEventListener("animationend", () => {
    frame.remove();
  });

  img.src = "./" + encodeURIComponent(filename);
}

/* =========================================
   PHOTO START SEQUENCE
   ========================================= */

function startPhotos() {
  if (photoStarted) return;

  photoStarted = true;

  createFallingPhoto();

  setTimeout(createFallingPhoto, 1500);
  setTimeout(createFallingPhoto, 3000);

  setTimeout(() => {
    createFallingPhoto();
    photoTimer = setInterval(createFallingPhoto, 5000);
  }, 8000);
}

/* =========================================
   HIDDEN YOUTUBE PLAYER WITH AUTOPLAY
   AND LOOPING ENABLED
   ========================================= */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubePlayerReady = false;
let startMusicWhenReady = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: "200",
    height: "200",

    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: videoId
    },

    events: {
      onReady: function(event) {
        youtubePlayerReady = true;

        if (startMusicWhenReady) {
          event.target.playVideo();
          startMusicWhenReady = false;
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.playVideo();
        }
      }
    }
  });
}

/* LOAD YOUTUBE API */

(function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* =========================================
   OPEN SURPRISE
   ========================================= */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {

  /* START THE HIDDEN SONG FROM THE OPENING BUTTON TAP */

  if (youtubePlayer && youtubePlayerReady) {
    youtubePlayer.playVideo();
  } else {
    startMusicWhenReady = true;
  }

  opening.style.opacity = "0";

  setTimeout(() => {
    opening.style.display = "none";
    main.style.display = "block";

    requestAnimationFrame(() => {
      main.style.opacity = "1";
    });

    startPhotos();
  }, 1000);
});
