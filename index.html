<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #21182f;
}
body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 25%, #81709e 0%, #55466e 35%, #322541 68%, #21182f 100%);
}

/* STARS */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 6px rgba(255,255,255,.7);
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .25; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* SHOOTING STARS */

.shooting-star {
  position: absolute;
  width: 130px;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
  transform: rotate(-35deg);
  opacity: 0;
  animation: shooting 7s linear infinite;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 0;
  top: -2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 10px 3px rgba(255,255,255,.6);
}
@keyframes shooting {
  0% {
    transform: translate(0,0) rotate(-35deg);
    opacity: 0;
  }
  5% { opacity: 1; }
  15% { opacity: 0; }
  100% {
    transform: translate(-550px,350px) rotate(-35deg);
    opacity: 0;
  }
}

/* OPENING */

#opening {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.5s ease;
}

.opening-content {
  position: relative;
  z-index: 2;
  padding: 25px;
  width: 100%;
  max-width: 500px;
}

.opening-eyebrow {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  margin-bottom: 30px;
}
.moon {
  font-size: 50px;
  margin-bottom: 15px;
  filter: drop-shadow(0 0 15px rgba(255,255,255,.35));
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(48px, 13vw, 76px);
  line-height: 1.1;
  font-weight: 400;
  color: #fff;
  text-shadow: 0 0 15px rgba(255,255,255,.15);
}

.opening-subtitle {
  margin-top: 18px;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 1px;
  color: rgba(255,255,255,.85);
}
.open-button {
  margin-top: 40px;
  padding: 15px 28px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 40px;
  background: rgba(255,255,255,.08);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: background .3s ease, transform .3s ease;
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.18);
}

/* MAIN SCREEN */

#main {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}
#photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* RANDOM-SIZED POLAROID PHOTO CARDS */

.falling-photo {
  position: absolute;
  top: -160px;
  object-fit: contain;
  object-position: center;
  padding: 4px;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 3px;
  background: white;
  box-shadow: 0 4px 18px rgba(20,10,30,.25);
  opacity: 0;
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform;
}

/* SLOW FALLING PHOTOS */

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,-10px,0) rotate(var(--rotation));
  }
  3% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift),110vh,0) rotate(calc(var(--rotation) + 25deg));
  }
}

/* CENTER MESSAGE */

.center-message {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  padding: 0 8px;
  text-align: center;
  white-space: nowrap;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(34px, 8.8vw, 55px);
  font-weight: 400;
  color: white;
  text-shadow: 0 0 12px rgba(255,255,255,.25);
}
.white-heart {
  width: clamp(22px, 5.5vw, 33px);
  height: auto;
  flex-shrink: 0;
  fill: white;
  filter: drop-shadow(0 0 5px rgba(255,255,255,.2));
}

/* NEW: BOTTOM LYRICS */

#lyrics {
  position: absolute;
  z-index: 6;
  left: 0;
  right: 0;
  bottom: calc(24px + env(safe-area-inset-bottom));
  width: 100%;
  padding: 0 24px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
}

#lyrics-text {
  display: inline-block;
  font-family: 'Allura', cursive;
  font-size: clamp(22px, 6vw, 32px);
  font-weight: 400;
  color: white;
  line-height: 1.15;
  text-shadow: 0 0 12px rgba(255,255,255,.25);
}

/* HIDDEN YOUTUBE PLAYER */

#youtube-player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -10000px;
  top: -10000px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}
#youtube-player-container iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

/* SMALL SCREENS */

@media (max-width: 380px) {
  .opening-subtitle { font-size: 17px; }

  .opening-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
  }
}

/* STARS */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");

    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 5 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";

    container.appendChild(star);
  }
}
createStars("opening-stars", 100);

/* PHOTO SHUFFLE / NO REPEATS */

const photos = document.getElementById("photos");

let photoDeck = [];
let lastDisplayedPhoto = null;
let failedPhotos = new Set();
let photoStarted = false;
let photoTimer = null;

/* TRACK PHOTOS THAT ARE STILL LOADING */
let pendingPhotos = 0;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function startNewPhotoCycle() {
  const availablePhotos = photoFiles.filter(
    filename => !failedPhotos.has(filename)
  );

  photoDeck = shuffle(availablePhotos);

  if (
    photoDeck.length > 1 &&
    photoDeck[0] === lastDisplayedPhoto
  ) {
    [photoDeck[0], photoDeck[1]] =
      [photoDeck[1], photoDeck[0]];
  }
}

function getNextPhoto() {
  if (photoDeck.length === 0) {

    /* WAIT UNTIL ALL PHOTOS FROM THE PREVIOUS
       CYCLE HAVE FINISHED LOADING AND APPEARED. */

    if (pendingPhotos > 0) return null;

    startNewPhotoCycle();
  }

  if (photoDeck.length === 0) return null;

  return photoDeck.shift();
}

/* RANDOM PHOTO DIMENSIONS */

function getRandomPhotoSize() {
  const sizes = [
    { width: 78, height: 98 },
    { width: 88, height: 110 },
    { width: 98, height: 122 },
    { width: 108, height: 135 },
    { width: 118, height: 148 },
    { width: 128, height: 160 }
  ];

  const selected = sizes[
    Math.floor(Math.random() * sizes.length)
  ];
  // Keep wider cards within the available screen width.
  const maxWidth = Math.max(70, window.innerWidth - 20);
  const scale = Math.min(1, maxWidth / selected.width);

  return {
    width: Math.round(selected.width * scale),
    height: Math.round(selected.height * scale)
  };
}

function createFallingPhoto() {
  const filename = getNextPhoto();

  if (!filename) return;

  const img = document.createElement("img");
  const rotation = -16 + Math.random() * 32;
  const duration = 35 + Math.random() * 10;
  const drift = -65 + Math.random() * 130;
  const size = getRandomPhotoSize();

  img.className = "falling-photo";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  img.style.width = size.width + "px";
  img.style.height = size.height + "px";
  // Randomize horizontal placement while keeping the whole card on screen.
  const availableWidth = Math.max(0, window.innerWidth - size.width);
  img.style.left = (Math.random() * availableWidth) + "px";

  img.style.setProperty("--rotation", rotation + "deg");
  img.style.setProperty("--fall-duration", duration + "s");
  img.style.setProperty("--drift", drift + "px");

  /* COUNT THIS PHOTO WHILE IT LOADS */
  pendingPhotos++;

  img.onload = () => {
    /* PHOTO HAS LOADED AND IS NOW DISPLAYED */
    pendingPhotos--;

    lastDisplayedPhoto = filename;
    photos.appendChild(img);
  };

  img.onerror = () => {
    /* FAILED PHOTO DOES NOT BLOCK THE NEXT CYCLE */
    pendingPhotos--;

    failedPhotos.add(filename);
    img.remove();
    console.warn("Skipping unavailable photo:", filename);
  };

  img.addEventListener("animationend", () => {
    img.remove();
  });

  img.src = "./" + encodeURIComponent(filename);
}

/* NEW: SHOW THE CURRENT LYRIC */

function updateLyrics() {
  if (
    !youtubePlayerReady ||
    currentPlayerState !== YT.PlayerState.PLAYING ||
    !youtubePlayer
  ) {
    hideLyrics();
    return;
  }

  const currentTime = youtubePlayer.getCurrentTime();

  const cue = lyricCues.find(
    lyric => currentTime >= lyric.start && currentTime < lyric.end
  );

  const newLyric = cue ? cue.text : "";

  if (newLyric === lastLyric) return;

  lastLyric = newLyric;

  lyricsContainer.style.opacity = "0";

  setTimeout(() => {
    if (lastLyric === newLyric) {
      lyricsText.textContent = newLyric;
      lyricsContainer.style.opacity = newLyric ? "1" : "0";
    }
  }, 350);
}

/* NEW: HIDE LYRICS */

function hideLyrics() {
  lastLyric = "";
  lyricsContainer.style.opacity = "0";
  lyricsText.textContent = "";
}

/* NEW: CHECK SONG POSITION REGULARLY */

function startLyricSync() {
  if (lyricTimer) return;

  lyricTimer = setInterval(updateLyrics, 250);
}

function stopLyricSync() {
  if (lyricTimer) {
    clearInterval(lyricTimer);
    lyricTimer = null;
  }

  hideLyrics();
}

/* YOUTUBE PLAYER */

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: "200",
    height: "200",

    videoId: videoId,
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: videoId
    },

    events: {
      onReady: function(event) {
        youtubePlayerReady = true;

        if (startMusicWhenReady) {
          event.target.playVideo();
          startMusicWhenReady = false;
        }
      },
      onStateChange: function(event) {
        currentPlayerState = event.data;

        if (event.data === YT.PlayerState.PLAYING) {
          startLyricSync();
        } else {
          stopLyricSync();
        }

        if (event.data === YT.PlayerState.ENDED) {
          event.target.playVideo();
        }
      }
    }
  });
}

  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* OPEN SURPRISE */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {

  // Start the hidden song from the opening-button interaction.
  if (youtubePlayer && youtubePlayerReady) {
    youtubePlayer.playVideo();
  } else {
    startMusicWhenReady = true;
  }

  opening.style.opacity = "0";
  setTimeout(() => {
    opening.style.display = "none";
    main.style.display = "block";

    requestAnimationFrame(() => {
      main.style.opacity = "1";
    });

    startPhotos();
  }, 1000);
});

</script>
