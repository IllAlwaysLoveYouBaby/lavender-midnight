<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #21182f;
}

body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 25%, #81709e 0%, #55466e 35%, #322541 68%, #21182f 100%);
}

/* STARS */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 6px rgba(255,255,255,.7);
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .25; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* SHOOTING STARS */

.shooting-star {
  position: absolute;
  width: 130px;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
  transform: rotate(-35deg);
  opacity: 0;
  animation: shooting 7s linear infinite;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 0;
  top: -2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 10px 3px rgba(255,255,255,.6);
}

@keyframes shooting {
  0% {
    transform: translate(0,0) rotate(-35deg);
    opacity: 0;
  }
  5% { opacity: 1; }
  15% { opacity: 0; }
  100% {
    transform: translate(-550px,350px) rotate(-35deg);
    opacity: 0;
  }
}

/* OPENING */

#opening {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.5s ease;
}

.opening-content {
  position: relative;
  z-index: 2;
  padding: 25px;
  width: 100%;
  max-width: 500px;
}

.opening-eyebrow {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  margin-bottom: 30px;
}

.moon {
  font-size: 50px;
  margin-bottom: 15px;
  filter: drop-shadow(0 0 15px rgba(255,255,255,.35));
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(48px, 13vw, 76px);
  line-height: 1.1;
  font-weight: 400;
  color: #fff;
  text-shadow: 0 0 15px rgba(255,255,255,.15);
}

.opening-subtitle {
  margin-top: 18px;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 1px;
  color: rgba(255,255,255,.85);
}

.open-button {
  margin-top: 40px;
  padding: 15px 28px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 40px;
  background: rgba(255,255,255,.08);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: background .3s ease, transform .3s ease;
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.18);
}

/* MAIN SCREEN */

#main {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

#photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* RANDOM-SIZED FLOATING PHOTOS */

.falling-photo-frame {
  position: absolute;
  top: -160px;
  opacity: 0;
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform;
}

/* ORIGINAL WHITE POLAROID */

.falling-photo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  border: 6px solid white;
  outline: none;
  padding: 5px;
  background: white;
  border-radius: 3px;
  box-shadow: 0 4px 18px rgba(20,10,30,.25);
}

/* CELESTIAL POLAROID DECORATIONS */

.photo-decoration-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}

.polaroid-celestial-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.celestial-line {
  fill: none;
  stroke: #a991cf;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .9;
}

.celestial-star {
  fill: #b9a4dc;
  stroke: #8e75b8;
  stroke-width: .65;
  opacity: .98;
}

.celestial-sparkle {
  fill: #c8b9e5;
  opacity: .95;
}

.celestial-moon {
  fill: #bba7dd;
  stroke: #927ab9;
  stroke-width: .8;
  opacity: .98;
}

.celestial-dot {
  fill: #a58bcf;
  opacity: .95;
}

/* SLOW FALLING PHOTOS */

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,-10px,0) rotate(var(--rotation));
  }
  3% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift),110vh,0) rotate(calc(var(--rotation) + 25deg));
  }
}

/* CENTER MESSAGE */

.center-message {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  padding: 0 8px;
  text-align: center;
  white-space: nowrap;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(34px, 8.8vw, 55px);
  font-weight: 400;
  color: white;
  text-shadow:
    0 0 2px #ffffff,
    0 0 5px #ffffff,
    0 0 10px rgba(255,255,255,1),
    0 0 20px rgba(255,255,255,.95),
    0 0 35px rgba(255,255,255,.8),
    0 0 55px rgba(220,205,255,.7),
    0 0 80px rgba(190,160,255,.45);
}

.white-heart {
  width: clamp(22px, 5.5vw, 33px);
  height: auto;
  flex-shrink: 0;
  fill: white;
  filter:
    drop-shadow(0 0 2px #ffffff)
    drop-shadow(0 0 5px #ffffff)
    drop-shadow(0 0 10px rgba(255,255,255,1))
    drop-shadow(0 0 20px rgba(255,255,255,.9))
    drop-shadow(0 0 35px rgba(255,255,255,.75))
    drop-shadow(0 0 55px rgba(190,160,255,.6));
}

/* HIDDEN YOUTUBE PLAYER */

#youtube-player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -10000px;
  top: -10000px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

#youtube-player-container iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

/* SMALL SCREENS */

@media (max-width: 380px) {
  .opening-subtitle { font-size: 17px; }

  .opening-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
  }
}
</style>

/* STARS */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");

    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 5 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";

    container.appendChild(star);
  }
}

/* PHOTO SHUFFLE / NO REPEATS */

const photos = document.getElementById("photos");

let photoDeck = [];
let lastDisplayedPhoto = null;
let failedPhotos = new Set();
let photoStarted = false;
let photoTimer = null;
let pendingPhotos = 0;

/* THESE TWO FILES FAILED THE PHOTO CHECKER */

const unavailablePhotos = new Set([
  "IMG_4101_Original.jpeg",
  "wedding-photo-12.png"
]);

/* RETRY TEMPORARY LOADING FAILURES */

const photoRetryCounts = new Map();
const MAX_PHOTO_RETRIES = 2;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function startNewPhotoCycle() {
  const availablePhotos = photoFiles.filter(
    filename =>
      !unavailablePhotos.has(filename) &&
      !failedPhotos.has(filename)
  );

  photoDeck = shuffle(availablePhotos);

  if (
    photoDeck.length > 1 &&
    photoDeck[0] === lastDisplayedPhoto
  ) {
    [photoDeck[0], photoDeck[1]] =
      [photoDeck[1], photoDeck[0]];
  }

  photoRetryCounts.clear();

  console.log(
    "Starting photo cycle with",
    photoDeck.length,
    "available photos."
  );
}

function getNextPhoto() {
  if (photoDeck.length === 0) {

    if (pendingPhotos > 0) return null;

    startNewPhotoCycle();
  }

  if (photoDeck.length === 0) return null;

  return photoDeck.shift();
}

/* RANDOM PHOTO DIMENSIONS */

function getRandomPhotoSize() {
  const sizes = [
    { width: 78, height: 98 },
    { width: 88, height: 110 },
    { width: 98, height: 122 },
    { width: 108, height: 135 },
    { width: 118, height: 148 },
    { width: 128, height: 160 }
  ];

  const selected = sizes[
    Math.floor(Math.random() * sizes.length)
  ];

  const maxWidth = Math.max(70, window.innerWidth - 20);
  const scale = Math.min(1, maxWidth / selected.width);

  return {
    width: Math.round(selected.width * scale),
    height: Math.round(selected.height * scale)
  };
}

/* CELESTIAL BORDER DECORATIONS */

function addPhotoDecorations(layer) {
  const svgNS = "http://www.w3.org/2000/svg";

  const svg = document.createElementNS(svgNS, "svg");

  svg.setAttribute("class", "polaroid-celestial-svg");
  svg.setAttribute("viewBox", "0 0 128 160");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");

  /*
    THE WHITE BORDER IS APPROXIMATELY 11PX WIDE.
    ALL DECORATIONS ARE DRAWN ALONG THE FRAME EDGES,
    NOT ACROSS THE PHOTOGRAPH.
  */

  function addPath(d, className) {
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", className);
    svg.appendChild(path);
  }

  function addCircle(cx, cy, radius, className) {
    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", cx);
    circle.setAttribute("cy", cy);
    circle.setAttribute("r", radius);
    circle.setAttribute("class", className);
    svg.appendChild(circle);
  }

  function addStar(cx, cy, size) {
    const points = [
      [cx, cy - size],
      [cx + size * .22, cy - size * .22],
      [cx + size, cy],
      [cx + size * .22, cy + size * .22],
      [cx, cy + size],
      [cx - size * .22, cy + size * .22],
      [cx - size, cy],
      [cx - size * .22, cy - size * .22]
    ];

    const d = points.map((point, index) =>
      (index === 0 ? "M" : "L") +
      point[0] + " " + point[1]
    ).join(" ") + " Z";

    addPath(d, "celestial-star");
  }

  function addSparkle(cx, cy, size) {
    addPath(
      `M ${cx} ${cy - size}
       Q ${cx + size * .12} ${cy - size * .12} ${cx + size} ${cy}
       Q ${cx + size * .12} ${cy + size * .12} ${cx} ${cy + size}
       Q ${cx - size * .12} ${cy + size * .12} ${cx - size} ${cy}
       Q ${cx - size * .12} ${cy - size * .12} ${cx} ${cy - size} Z`,
      "celestial-sparkle"
    );
  }

  function addMoon(x, y, scale, rotation) {
    const group = document.createElementNS(svgNS, "g");

    group.setAttribute(
      "transform",
      `translate(${x} ${y}) rotate(${rotation}) scale(${scale})`
    );

    const moon = document.createElementNS(svgNS, "path");

    moon.setAttribute(
      "d",
      "M 5 -7 C -3 -5 -4 6 4 8 C 1 4 1 -2 5 -7 Z"
    );

    moon.setAttribute("class", "celestial-moon");

    group.appendChild(moon);
    svg.appendChild(group);
  }

    function() {
      addMoon(9, 8, 1.05, -18);
      addStar(116, 8, 5);
      addStar(13, 151, 4.5);
      addSparkle(112, 151, 3);

      addSparkle(13, 151, 3.5);
      addPath("M 110 151 Q 96 156 84 150", "celestial-line");
      addCircle(84, 150, 1.4, "celestial-dot");

      addPath("M 109 8 Q 97 3 86 9", "celestial-line");

    },

      addMoon(9, 8, .95, -15);
      addStar(116, 8, 5);
      addStar(116, 151, 4.5);
      addStar(11, 151, 3.5);
      addPath("M 17 8 L 29 5 L 40 9", "celestial-line");
      addCircle(29, 5, 1.3, "celestial-dot");
    },

    function() {
      addMoon(118, 150, 1, 165);
      addStar(11, 8, 5);
      addStar(64, 151, 4.5);
      addStar(116, 8, 3.5);
      addPath("M 110 150 L 99 154 L 88 150", "celestial-line");
      addCircle(99, 154, 1.3, "celestial-dot");
    }
  ];

  const selectedDesign =
    designs[Math.floor(Math.random() * designs.length)];

  selectedDesign();

  /* ADD A FEW RANDOM SMALL SPARKLES */

  const sparklePositions = [
    [34, 8],
    [94, 8],
    [34, 151],
    [94, 151],
    [8, 42],
    [120, 42],
    [8, 118],
    [120, 118]
  ];

  const selectedSparkles = shuffle(sparklePositions).slice(
    0,
    1 + Math.floor(Math.random() * 3)
  );

  selectedSparkles.forEach(position => {
    addSparkle(
      position[0],
      position[1],
      2.2 + Math.random() * 1.2
    );
  });

  layer.appendChild(svg);
}

function createFallingPhoto() {
  const filename = getNextPhoto();

  if (!filename) return;

  const frame = document.createElement("div");
  const img = document.createElement("img");
  const decorationLayer = document.createElement("div");

  const rotation = -16 + Math.random() * 32;
  const duration = 35 + Math.random() * 10;
  const drift = -65 + Math.random() * 130;
  const size = getRandomPhotoSize();

  frame.className = "falling-photo-frame";

  frame.style.width = size.width + "px";
  frame.style.height = size.height + "px";

  const availableWidth = Math.max(0, window.innerWidth - size.width);
  frame.style.left = (Math.random() * availableWidth) + "px";

  frame.style.setProperty("--rotation", rotation + "deg");
  frame.style.setProperty("--fall-duration", duration + "s");
  frame.style.setProperty("--drift", drift + "px");

  img.className = "falling-photo-image";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  decorationLayer.className = "photo-decoration-layer";

  addPhotoDecorations(decorationLayer);

  frame.appendChild(img);
  frame.appendChild(decorationLayer);

  pendingPhotos++;

  img.onload = () => {
    pendingPhotos--;

    photoRetryCounts.delete(filename);
    lastDisplayedPhoto = filename;

    photos.appendChild(frame);

    console.log("Photo displayed:", filename);
  };

  img.onerror = () => {
    pendingPhotos--;

    const retries = photoRetryCounts.get(filename) || 0;

    if (retries < MAX_PHOTO_RETRIES) {
      photoRetryCounts.set(filename, retries + 1);

      photoDeck.push(filename);

      console.warn(
        "Retrying photo:",
        filename,
        "Attempt:",
        retries + 1
      );
    } else {
      failedPhotos.add(filename);
      photoRetryCounts.delete(filename);

      console.warn(
        "Skipping photo after retries:",
        filename
      );
    }

    frame.remove();
  };

  frame.addEventListener("animationend", () => {
    frame.remove();
  });

  img.src = "./" + encodeURIComponent(filename);
}

/* PHOTO START SEQUENCE */

function startPhotos() {
  if (photoStarted) return;

  photoStarted = true;

  createFallingPhoto();

  setTimeout(createFallingPhoto, 1500);
  setTimeout(createFallingPhoto, 3000);

  setTimeout(() => {
    createFallingPhoto();
    photoTimer = setInterval(createFallingPhoto, 5000);
  }, 8000);
}

/* HIDDEN YOUTUBE PLAYER WITH AUTOPLAY AND LOOP */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubePlayerReady = false;
let startMusicWhenReady = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: "200",
    height: "200",

    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: videoId
    },

    events: {
      onReady: function(event) {
        youtubePlayerReady = true;

        if (startMusicWhenReady) {
          event.target.playVideo();
          startMusicWhenReady = false;
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.playVideo();
        }
      }
    }
  });
}

/* LOAD YOUTUBE API */

(function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* OPEN SURPRISE */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {

  /* START THE HIDDEN SONG FROM THE OPENING BUTTON TAP. */

  if (youtubePlayer && youtubePlayerReady) {
    youtubePlayer.playVideo();
  } else {
    startMusicWhenReady = true;
  }

  opening.style.opacity = "0";

  setTimeout(() => {
    opening.style.display = "none";
    main.style.display = "block";

    requestAnimationFrame(() => {
      main.style.opacity = "1";
    });

    startPhotos();
  }, 1000);
});
