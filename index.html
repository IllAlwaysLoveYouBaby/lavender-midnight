<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #100b1c;
}

body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 42%, #382849 0%, #21182f 42%, #100b1c 100%);
}

/* DEEP GALAXY AND NEBULA CLOUDS */

.screen::before,
.screen::after {
  content: "";
  position: absolute;
  inset: -25%;
  z-index: -1;
  pointer-events: none;
}

.screen::before {
  background:
    radial-gradient(ellipse at 18% 28%,
      rgba(139, 102, 174, .30) 0%,
      rgba(103, 75, 143, .16) 19%,
      transparent 42%),
    radial-gradient(ellipse at 78% 22%,
      rgba(105, 83, 151, .28) 0%,
      rgba(87, 62, 126, .14) 23%,
      transparent 45%),
    radial-gradient(ellipse at 65% 72%,
      rgba(135, 91, 158, .25) 0%,
      rgba(92, 65, 127, .13) 25%,
      transparent 48%),
    radial-gradient(ellipse at 24% 82%,
      rgba(90, 72, 139, .24) 0%,
      transparent 42%);
  filter: blur(28px);
  animation: nebulaDrift 32s ease-in-out infinite alternate;
}

.screen::after {
  background:
    radial-gradient(ellipse at 45% 18%,
      rgba(179, 145, 204, .12) 0%,
      transparent 32%),
    radial-gradient(ellipse at 88% 56%,
      rgba(133, 102, 177, .16) 0%,
      transparent 38%),
    radial-gradient(ellipse at 12% 58%,
      rgba(105, 80, 151, .17) 0%,
      transparent 36%),
    radial-gradient(ellipse at 48% 92%,
      rgba(123, 87, 155, .15) 0%,
      transparent 38%);
  filter: blur(42px);
  animation: nebulaDrift 42s ease-in-out infinite alternate-reverse;
}

@keyframes nebulaDrift {
  0% { transform: translate3d(-2%, -1%, 0) scale(1); }
  50% { transform: translate3d(2%, 2%, 0) scale(1.08); }
  100% { transform: translate3d(-1%, 3%, 0) scale(1.03); }
}

/* BACKGROUND STARS */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 7px 1px rgba(255,255,255,.75);
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% {
    opacity: .2;
    transform: scale(.75);
  }
  50% {
    opacity: 1;
    transform: scale(1.6);
  }
}

/* FOUR-POINT BACKGROUND SPARKLES */

.sky-sparkle {
  position: absolute;
  width: 9px;
  height: 9px;
  background: rgba(245, 236, 255, .9);
  clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
  filter: drop-shadow(0 0 5px rgba(231,213,255,.9));
  animation: sparklePulse 3.5s ease-in-out infinite;
}

@keyframes sparklePulse {
  0%, 100% { opacity: .25; transform: scale(.7) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.2) rotate(20deg); }
}

/* SHOOTING STARS */

.shooting-star {
  position: absolute;
  z-index: 2;
  width: 150px;
  height: 1.5px;
  opacity: 0;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(226,211,255,.15),
    rgba(255,255,255,.95),
    transparent
  );
  transform: rotate(-35deg);
  filter: drop-shadow(0 0 4px rgba(226,211,255,.8));
  animation: shooting 8s ease-in-out infinite;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 20px;
  top: -2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 9px 3px rgba(255,255,255,.8);
}

@keyframes shooting {
  0%, 72% {
    opacity: 0;
    transform: translate(0,0) rotate(-35deg);
  }
  74% { opacity: 1; }
  82% {
    opacity: 0;
    transform: translate(-330px,210px) rotate(-35deg);
  }
  100% {
    opacity: 0;
    transform: translate(-330px,210px) rotate(-35deg);
  }
}

/* OPENING SCREEN */

#opening {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.5s ease;
}

.opening-content {
  position: relative;
  z-index: 3;
  padding: 25px;
  width: 100%;
  max-width: 500px;
}

.opening-eyebrow {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.78);
  margin-bottom: 30px;
}

.moon {
  font-size: 50px;
  margin-bottom: 15px;
  color: #eee3ff;
  filter: drop-shadow(0 0 15px rgba(218,195,255,.65));
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(48px, 13vw, 76px);
  line-height: 1.1;
  font-weight: 400;
  color: #fff;
  text-shadow: 0 0 18px rgba(221,201,255,.3);
}

.opening-subtitle {
  margin-top: 18px;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 1px;
  color: rgba(255,255,255,.88);
}

.open-button {
  margin-top: 40px;
  padding: 15px 28px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 40px;
  background: rgba(255,255,255,.08);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: background .3s ease, transform .3s ease;
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.18);
}

/* MAIN SCREEN */

#main {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

#photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 3;
}

/* FALLING POLAROIDS */

.falling-photo-frame {
  position: absolute;
  top: -160px;
  opacity: 0;
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform;
}

.falling-photo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  border: 6px solid white;
  outline: none;
  padding: 5px;
  background: white;
  border-radius: 3px;
  box-shadow: 0 4px 18px rgba(10,5,20,.4);
}

/* CELESTIAL POLAROID DECORATIONS */

.photo-decoration-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}

.photo-decoration-layer svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,-10px,0) rotate(var(--rotation));
  }
  3% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift),110vh,0)
      rotate(calc(var(--rotation) + 25deg));
  }
}

/* CENTER MESSAGE AND HEART */

.center-message {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 20px);
  max-width: 520px;
  padding: 0;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(25px, 7.1vw, 48px);
  line-height: 1.12;
  font-weight: 400;
  color: white;
  white-space: nowrap;
  text-shadow:
    0 0 2px #fff,
    0 0 5px #fff,
    0 0 11px rgba(255,255,255,.95),
    0 0 22px rgba(255,255,255,.85),
    0 0 38px rgba(220,205,255,.8),
    0 0 60px rgba(190,160,255,.55);
}

.white-heart {
  width: clamp(19px, 5.2vw, 31px);
  height: auto;
  flex: 0 0 auto;
  fill: white;
  filter:
    drop-shadow(0 0 2px #fff)
    drop-shadow(0 0 5px #fff)
    drop-shadow(0 0 11px rgba(255,255,255,.95))
    drop-shadow(0 0 22px rgba(255,255,255,.85))
    drop-shadow(0 0 38px rgba(190,160,255,.65));
}

/* HIDDEN YOUTUBE PLAYER */

#youtube-player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -10000px;
  top: -10000px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

#youtube-player-container iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

/* SMALL SCREENS */

@media (max-width: 380px) {
  .opening-subtitle { font-size: 17px; }

  .opening-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
  }

  .center-message {
    width: calc(100% - 12px);
    gap: 3px;
  }

  .message-text {
    font-size: clamp(23px, 6.9vw, 27px);
  }

  .white-heart {
    width: 19px;
  }
}
</style>

/* BACKGROUND STARS AND SPARKLES */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 5 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";

    if (Math.random() < 0.16) {
      star.style.width = "3px";
      star.style.height = "3px";
      star.style.boxShadow = "0 0 10px 2px rgba(255,255,255,.85)";
    }

    container.appendChild(star);
  }

  for (let i = 0; i < 15; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sky-sparkle";
    sparkle.style.left = Math.random() * 100 + "%";
    sparkle.style.top = Math.random() * 100 + "%";
    sparkle.style.animationDelay = Math.random() * 5 + "s";
    sparkle.style.animationDuration = (2.5 + Math.random() * 3) + "s";
    container.appendChild(sparkle);
  }
}

createStars("opening-stars", 125);

/* PHOTO SHUFFLE / NO REPEATS */

const photos = document.getElementById("photos");

let photoDeck = [];
let lastDisplayedPhoto = null;
let failedPhotos = new Set();
let photoStarted = false;
let photoTimer = null;
let pendingPhotos = 0;

/* THESE TWO FILES FAILED THE PHOTO CHECKER */

const unavailablePhotos = new Set([
  "IMG_4101_Original.jpeg",
  "wedding-photo-12.png"
]);

/* RETRY TEMPORARY LOADING FAILURES */

const photoRetryCounts = new Map();
const MAX_PHOTO_RETRIES = 2;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function startNewPhotoCycle() {
  const availablePhotos = photoFiles.filter(
    filename =>
      !unavailablePhotos.has(filename) &&
      !failedPhotos.has(filename)
  );

  photoDeck = shuffle(availablePhotos);

  if (
    photoDeck.length > 1 &&
    photoDeck[0] === lastDisplayedPhoto
  ) {
    [photoDeck[0], photoDeck[1]] =
      [photoDeck[1], photoDeck[0]];
  }

  photoRetryCounts.clear();

  console.log(
    "Starting photo cycle with",
    photoDeck.length,
    "available photos."
  );
}

function getNextPhoto() {
  if (photoDeck.length === 0) {
    if (pendingPhotos > 0) return null;
    startNewPhotoCycle();
  }

  if (photoDeck.length === 0) return null;

  return photoDeck.shift();
}

/* RANDOM PHOTO DIMENSIONS */

function getRandomPhotoSize() {
  const sizes = [
    { width: 78, height: 98 },
    { width: 88, height: 110 },
    { width: 98, height: 122 },
    { width: 108, height: 135 },
    { width: 118, height: 148 },
    { width: 128, height: 160 }
  ];

  const selected = sizes[
    Math.floor(Math.random() * sizes.length)
  ];

  const maxWidth = Math.max(70, window.innerWidth - 20);
  const scale = Math.min(1, maxWidth / selected.width);

  return {
    width: Math.round(selected.width * scale),
    height: Math.round(selected.height * scale)
  };
}

        filter="url(#glow)"
      />
    </g>`;

  const patterns = [
    () => `
      ${moon(12, 12, .78)}
      ${star(29, 8, 5.5)}
      ${sparkle(45, 10, 3.5)}
      ${star(116, 146, 5)}
      ${sparkle(99, 151, 3)}
      ${sparkle(8, 145, 3.5)}
    `,
    () => `
      ${moon(116, 12, .78, true)}
      ${star(98, 8, 5.5)}
      ${sparkle(82, 10, 3.5)}
      ${star(12, 147, 5)}
      ${sparkle(29, 151, 3)}
      ${sparkle(119, 80, 3.5)}
    `,
    () => `
      ${moon(12, 148, .78)}
      ${star(29, 151, 5.5)}
      ${sparkle(46, 150, 3.5)}
      ${star(116, 12, 5)}
      ${sparkle(99, 8, 3)}
      ${sparkle(8, 78, 3.5)}
    `,
    () => `
      ${moon(116, 148, .78, true)}
      ${star(98, 151, 5.5)}
      ${sparkle(82, 150, 3.5)}
      ${star(12, 12, 5)}
      ${sparkle(29, 8, 3)}
      ${sparkle(119, 80, 3.5)}
    `,
    () => `
      ${moon(12, 12, .72)}
      ${star(116, 12, 5.5)}
      ${star(12, 148, 5)}
      ${sparkle(29, 8, 3.5)}
      ${sparkle(98, 151, 3.5)}
      ${sparkle(116, 80, 3)}
    `,
    () => `
      ${moon(116, 12, .72, true)}

      ${star(116, 148, 5)}
      ${sparkle(98, 8, 3.5)}
      ${sparkle(29, 151, 3.5)}
      ${sparkle(8, 80, 3)}
    `
  ];

  const selectedPattern =
    patterns[Math.floor(Math.random() * patterns.length)];

  const extraSparkles = Math.random() < .55
    ? `${sparkle(64, 8, 3, .75)}`
    : "";

  layer.innerHTML = `
    <svg viewBox="0 0 128 160" preserveAspectRatio="none"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="1.1" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      ${selectedPattern()}

    </svg>
  `;
}

/* CREATE FALLING PHOTO */

function createFallingPhoto() {
  const filename = getNextPhoto();

  if (!filename) return;

  const frame = document.createElement("div");
  const img = document.createElement("img");
  const decorationLayer = document.createElement("div");

  const rotation = -16 + Math.random() * 32;
  const duration = 35 + Math.random() * 10;
  const drift = -65 + Math.random() * 130;
  const size = getRandomPhotoSize();

  frame.className = "falling-photo-frame";
  frame.style.width = size.width + "px";
  frame.style.height = size.height + "px";

  const availableWidth = Math.max(0, window.innerWidth - size.width);
  frame.style.left = (Math.random() * availableWidth) + "px";

  frame.style.setProperty("--rotation", rotation + "deg");
  frame.style.setProperty("--fall-duration", duration + "s");
  frame.style.setProperty("--drift", drift + "px");

  img.className = "falling-photo-image";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  decorationLayer.className = "photo-decoration-layer";
  addPhotoDecorations(decorationLayer);

  frame.appendChild(img);
  frame.appendChild(decorationLayer);

  pendingPhotos++;

  img.onload = () => {
    pendingPhotos--;
    photoRetryCounts.delete(filename);
    lastDisplayedPhoto = filename;

    photos.appendChild(frame);

    console.log("Photo displayed:", filename);
  };

  img.onerror = () => {
    pendingPhotos--;

    const retries = photoRetryCounts.get(filename) || 0;

    if (retries < MAX_PHOTO_RETRIES) {
      photoRetryCounts.set(filename, retries + 1);
      photoDeck.push(filename);

      console.warn(
        "Retrying photo:",
        filename,
        "Attempt:",
        retries + 1
      );
    } else {
      failedPhotos.add(filename);
      photoRetryCounts.delete(filename);

      console.warn(
        "Skipping photo after retries:",
        filename
      );
    }

    frame.remove();
  };

  frame.addEventListener("animationend", () => {
    frame.remove();
  });

  img.src = "./" + encodeURIComponent(filename);
}

/* PHOTO START SEQUENCE */

function startPhotos() {
  if (photoStarted) return;

  photoStarted = true;

  createFallingPhoto();

  setTimeout(createFallingPhoto, 1500);
  setTimeout(createFallingPhoto, 3000);

  setTimeout(() => {
    createFallingPhoto();
    photoTimer = setInterval(createFallingPhoto, 5000);
  }, 8000);
}

/* HIDDEN YOUTUBE PLAYER WITH AUTOPLAY AND LOOP */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubePlayerReady = false;
let startMusicWhenReady = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: "200",
    height: "200",
    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: videoId
    },

    events: {
      onReady: function(event) {
        youtubePlayerReady = true;

        if (startMusicWhenReady) {
          event.target.playVideo();
          startMusicWhenReady = false;
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.playVideo();
        }
      }
    }
  });
}

/* LOAD YOUTUBE API */

(function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* OPEN SURPRISE */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {
  if (youtubePlayer && youtubePlayerReady) {
    youtubePlayer.playVideo();
  } else {
    startMusicWhenReady = true;
  }

  opening.style.opacity = "0";

  setTimeout(() => {
    opening.style.display = "none";
    main.style.display = "block";

    requestAnimationFrame(() => {
      main.style.opacity = "1";
    });

    startPhotos();
  }, 1000);
});
