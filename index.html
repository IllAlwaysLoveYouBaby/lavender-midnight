
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavender Midnight ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Nunito', sans-serif;
  color: white;
  background: linear-gradient(180deg,#967b96,#705c7a 55%,#483d59);
}

/* OPENING */

#opening {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 25%,#b493b1 0%,transparent 58%),
    linear-gradient(180deg,#967b96 0%,#705c7a 55%,#51445f 100%);
  transition: opacity 1.2s ease, visibility 1.2s ease;
}

#opening.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 4px;
  font-weight: 600;
  margin-bottom: 24px;
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(3.2rem,12vw,5.5rem);
  line-height: 1.05;
  text-shadow: 0 0 20px rgba(255,255,255,.35);
}

.subtitle {
  font-size: 13px;
  letter-spacing: 1px;
  margin-top: 18px;
  opacity: .9;
}

.open-button {
  margin-top: 42px;
  padding: 13px 28px;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 30px;
  background: rgba(255,255,255,.12);
  color: white;
  font: 13px 'Nunito',sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
}

.open-button:disabled {
  opacity: .55;
  cursor: wait;
}

#loading-message {
  margin-top: 14px;
  min-height: 18px;
  font-size: 10px;
  opacity: .8;
}

/* MAIN */

#main {
  position: fixed;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.8s ease;
  background:
    radial-gradient(ellipse at 50% 25%,#987c9b 0%,transparent 55%),
    linear-gradient(180deg,#806983 0%,#62516f 55%,#433a54 100%);
}

#main.visible { opacity: 1; }

/* STARS */

#stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: white;
  opacity: .5;
  box-shadow: 0 0 7px 2px rgba(255,255,255,.35);
  animation: twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: .95; transform: scale(1.35); }
}

/* MOON */

.moon {
  position: absolute;
  top: 8%;
  right: 12%;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #f5e9f4;
  box-shadow: 0 0 24px rgba(255,240,255,.5);
  opacity: .85;
  z-index: 1;
}

.moon::after {
  content: "";
  position: absolute;
  top: -7px;
  left: 14px;
  width: 47px;
  height: 47px;
  border-radius: 50%;
  background: #89708d;
}

/* MESSAGE */

#message {
  position: absolute;
  z-index: 5;
  top: 45%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 96%;
  text-align: center;
  white-space: nowrap;
  font-family: 'Allura',cursive;
  font-size: clamp(1.4rem,7vw,4.2rem);
  color: white;
  text-shadow: 0 0 8px rgba(255,255,255,.75),
               0 0 22px rgba(255,255,255,.4);
  pointer-events: none;
}

/* FALLING PHOTOS */

#photos {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}

.falling-photo {
  position: absolute;
  top: -180px;
  width: var(--photo-width);
  height: auto;
  max-height: 145px;
  object-fit: cover;
  padding: 4px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 3px;
  background: rgba(255,255,255,.9);
  box-shadow: 0 4px 18px rgba(20,10,30,.25);
  opacity: 0;
  visibility: hidden;
  animation: fall var(--fall-duration) linear forwards;
}

@keyframes fall {
  0% {
    opacity: 0;
    transform: translateY(0) rotate(var(--rotation));
  }
  10% { opacity: .85; }
  85% { opacity: .8; }
  100% {
    opacity: 0;
    transform:
      translate(var(--drift),115vh)
      rotate(calc(var(--rotation) + 35deg));
  }
}

/* MUSIC AREA */

#music-area {
  position: absolute;
  z-index: 10;
  bottom: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: min(92%,260px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

#music-player {
  width: 190px;
  height: 107px;
  overflow: hidden;
  border-radius: 8px;
  background: rgba(255,255,255,.08);
  box-shadow: 0 3px 18px rgba(20,10,30,.25);
}

#music-player iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#play-song {
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 22px;
  padding: 7px 20px;
  background: rgba(255,255,255,.16);
  color: white;
  font: 11px 'Nunito',sans-serif;
  letter-spacing: .6px;
  cursor: pointer;
}

#play-song:disabled {
  opacity: .5;
  cursor: wait;
}

#music-note {
  margin: 0;
  width: 100%;
  color: rgba(255,255,255,.9);
  font-size: 9px;
  line-height: 1.45;
  font-weight: 300;
  text-align: center;
  text-shadow: 0 1px 5px rgba(20,10,30,.5);
}

#music-status {
  min-height: 12px;
  margin: 0;
  font-size: 9px;
  text-align: center;
  color: rgba(255,255,255,.8);
}

#youtube-fallback {
  display: none;
  color: white;
  font-size: 10px;
  text-decoration: underline;
}

/* MOBILE */

@media (max-width: 380px) {
  #message {
    font-size: clamp(1.35rem,6.5vw,2.2rem);
  }

  .falling-photo { max-height: 115px; }

  #music-player {
    width: 160px;
    height: 90px;
  }

  #music-area { bottom: 7px; }
  #music-note { font-size: 8.5px; }
}
</style>
</head>

<body>

<div id="opening">
  <div class="eyebrow">A LITTLE MOMENT, JUST FOR YOU</div>

  <div class="opening-title">Under the Shooting Stars</div>

  <div class="subtitle">
    Some things are worth taking a moment for...
  </div>

  <button class="open-button" id="openButton" disabled>
    Preparing Your Surprise...
  </button>

  <div id="loading-message">
    Getting the music ready ♡
  </div>
</div>

<main id="main">

  <div id="stars"></div>
  <div class="moon"></div>
  <div id="photos"></div>

  <div id="message">
    I'll Always Choose You ♥
  </div>

  <div id="music-area">

    <div id="music-player"></div>

    <button id="play-song" disabled>
      Play Song ♫
    </button>

    <p id="music-note">
      The song is set to start when you open the surprise.
      If your iPhone blocks playback, tap Play here.
    </p>

    <p id="music-status"></p>

    <a id="youtube-fallback"
       href="https://www.youtube.com/watch?v=yLZoVTayvxY"
       target="_blank"
       rel="noopener">
      Open song on YouTube
    </a>

  </div>
</main>

<script>

/* PHOTO FILES */

const photoFiles = [
  "Picture_36_Original_Original.jpeg",
  "PXL_20201225_045227157.NIGHT_Original_Original.jpeg",
  "IMG_9485_Original.jpeg",
  "IMG_9411_Original.jpeg",
  "IMG_8192_Original.jpeg",
  "IMG_7911_Original.jpeg",
  "IMG_7612_Original.jpeg",
  "IMG_7552_Original.jpeg",
  "IMG_7431_Original.jpeg",
  "IMG_6943_Original.jpeg",
  "IMG_6928_Original.jpeg",
  "IMG_6913_Original.jpeg",
  "IMG_6013_Original.jpeg",
  "IMG_5882_Original.jpeg",
  "IMG_5283_Original.jpeg",
  "IMG_4910_Original.jpeg",
  "IMG_4477_Original.jpeg",
  "IMG_4423_Original.jpeg",
  "IMG_4418_Original.jpeg",
  "IMG_4376_Original.jpeg",
  "IMG_4248_Original.jpeg",
  "IMG_4101_Original.jpeg",
  "IMG_3861_Original.jpeg",
  "IMG_3852_Original.jpeg",
  "IMG_3568_Original.jpeg",
  "IMG_3386_Original.jpeg",
  "IMG_3251_Original.jpeg",
  "IMG_3146_Original.jpeg",
  "IMG_2786_Original.jpeg",
  "IMG_2670_Original.jpeg",
  "IMG_2457_Original.jpeg",
  "IMG_2126_Original.jpeg",
  "IMG_1766_Original.jpeg",
  "IMG_1707_Original.jpeg",
  "IMG_1671_Original.jpeg",
  "IMG_1637_Original.jpeg",
  "IMG_1611_Original.jpeg",
  "IMG_1572_Original.jpeg",
  "IMG_1475_Original.jpeg",
  "IMG_0866_Original.jpeg",
  "IMG_0880_Original.jpeg",
  "IMG_0710_Original.jpeg",
  "IMG_0668_Original.jpeg",
  "IMG_0586_Original.jpeg",
  "IMG_0581_Original.jpeg",
  "IMG_0578_Original.jpeg",
  "IMG_0287_Original.jpeg",
  "IMG_0242_Original.jpeg",
  "FBC1621D-16B5-47FD-8211-F0C568D772B5_Original.jpeg",
  "F7343407-203D-45D6-8BB2-4D16D2D8D40A_Original.jpeg",
  "D41356E5-D304-4600-A436-F31E1A256817_Original.jpeg",
  "948A11A9-4C71-4F70-B5D5-367342B0C1FA_Original.jpeg",
  "8F12514D-A331-489B-B427-AEFD392EAAB6_Original.jpeg",
  "7E11638B-414A-405A-83F5-AEB1AB1D56B3_Original.jpeg",
  "1663_Original_Original_Original.jpeg",
  "090320F3-BD17-477A-9EE2-FDBC2A765FB8_Original.jpeg",
  "IMG_0911_Original.jpeg",
  "IMG_5759_Original.jpeg",
  "IMG_3926_Original.jpeg",
  "9F274428-57F9-4635-8F59-2F71D23A9E15_Original.jpeg",
  "wedding-photo-1.jpg",
  "wedding-photo-2.jpg",
  "wedding-photo-3.png",
  "wedding-photo-4.png",
  "wedding-photo-5.png",
  "wedding-photo-6.png",
  "wedding-photo-7.png"
];

/* ELEMENTS */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("openButton");
const loadingMessage = document.getElementById("loading-message");
const playSongButton = document.getElementById("play-song");
const musicStatus = document.getElementById("music-status");
const youtubeFallback = document.getElementById("youtube-fallback");
const photos = document.getElementById("photos");

const videoId = "yLZoVTayvxY";

let player = null;
let playerReady = false;
let openingTapped = false;
let photoDeck = [];
let lastPhoto = null;
let photoTimer = null;
let availablePhotoFiles = [];

/* MUSIC PLAYER */

function setMusicStatus(message) {
  musicStatus.textContent = message;
}

/*
  The YouTube API is loaded before the opening button
  is enabled. This is important: the visitor's tap
  can then call playVideo() on an already-ready player.
*/

function enableOpening() {
  openButton.disabled = false;
  openButton.textContent = "Open Your Surprise ♡";
  loadingMessage.textContent = "Your surprise is ready ♡";
}

function showMusicFallback() {
  openButton.disabled = false;
  openButton.textContent = "Open Your Surprise ♡";
  loadingMessage.textContent = "Your surprise is ready ♡";
  youtubeFallback.style.display = "block";
  setMusicStatus("If the player doesn't load, open the song on YouTube.");
}

window.onYouTubeIframeAPIReady = function() {

  player = new YT.Player("music-player", {
    width: "190",
    height: "107",
    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 1,
      playsinline: 1,
      rel: 0,
      modestbranding: 1,
      loop: 1,
      playlist: videoId,
      enablejsapi: 1
    },

    events: {

      onReady: function() {

        playerReady = true;

        playSongButton.disabled = false;

        enableOpening();

        /*
          If the visitor tapped while the player
          was still initializing, try playback now.
        */

        if (openingTapped) {
          startPlayback();
        }
      },

      onStateChange: function(event) {

        if (event.data === YT.PlayerState.PLAYING) {
          setMusicStatus("Now playing ♡");
        }

        if (event.data === YT.PlayerState.PAUSED) {
          setMusicStatus("Song paused");
        }

        if (event.data === YT.PlayerState.ENDED) {
          try {
            player.playVideo();
          } catch (error) {
            console.log(error);
          }
        }
      },

      onError: function(event) {
        console.warn("YouTube player error:", event.data);
        setMusicStatus("Playback unavailable. Try opening the song on YouTube.");
        youtubeFallback.style.display = "block";
      }
    }
  });

};

/* LOAD YOUTUBE API */

const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";

youtubeScript.onerror = function() {
  showMusicFallback();
};

document.head.appendChild(youtubeScript);

/*
  Safety fallback: don't leave the opening screen
  permanently disabled if the YouTube API cannot load.
*/

setTimeout(function() {
  if (!playerReady) {
    showMusicFallback();
  }
}, 12000);

/* PLAYBACK */

function startPlayback() {

  if (!playerReady || !player) {
    setMusicStatus("The music player is still getting ready.");
    return;
  }

  try {

    /*
      Explicitly request normal-volume playback.
      No forced mute is applied.
    */

    player.unMute();
    player.setVolume(100);
    player.playVideo();

    setMusicStatus("Starting your song ♡");

  } catch (error) {

    console.warn("Playback request failed:", error);

    setMusicStatus("If playback is blocked, tap Play Song ♫.");
  }
}

/* OPENING BUTTON */

openButton.addEventListener("click", function() {

  openingTapped = true;

  /*
    Call the player directly from the visitor's tap,
    before changing screens.
  */

  if (playerReady) {
    startPlayback();
  }

  opening.classList.add("hidden");
  main.classList.add("visible");

  startPhotos();
});

/* MANUAL PLAY BUTTON */

playSongButton.addEventListener("click", function() {

  if (playerReady) {
    startPlayback();
  } else {
    setMusicStatus("The player is still loading. Please try again shortly.");
  }
});

/* STAR FIELD */

function makeStars() {

  const container = document.getElementById("stars");

  for (let i = 0; i < 85; i++) {

    const star = document.createElement("span");

    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.animationDuration = 2 + Math.random() * 4 + "s";

    container.appendChild(star);
  }
}

/* SHUFFLE */

function shuffle(array) {

  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

/* VALIDATE PHOTOS BEFORE DISPLAYING */

function validatePhotos() {

  const checks = photoFiles.map(function(filename) {

    return new Promise(function(resolve) {

      const testImage = new Image();

      testImage.onload = function() {
        resolve(filename);
      };

      testImage.onerror = function() {
        console.warn("Photo not found or unable to load:", filename);
        resolve(null);
      };

      testImage.src = "./" + encodeURIComponent(filename);
    });
  });

  return Promise.all(checks).then(function(results) {

    availablePhotoFiles = results.filter(Boolean);

    console.log(
      "Successfully validated photos:",
      availablePhotoFiles.length,
      "of",
      photoFiles.length
    );

    return availablePhotoFiles;
  });
}

/* PHOTO DECK: NO REPEATS UNTIL CYCLE ENDS */

function getNextPhoto() {

  if (photoDeck.length === 0) {

    photoDeck = shuffle(availablePhotoFiles);

    if (
      photoDeck.length > 1 &&
      photoDeck[0] === lastPhoto
    ) {
      [photoDeck[0], photoDeck[1]] =
        [photoDeck[1], photoDeck[0]];
    }
  }

  lastPhoto = photoDeck.shift();

  return lastPhoto;
}

/* CREATE FALLING PHOTO */

function createFallingPhoto() {

  if (availablePhotoFiles.length === 0) return;

  const filename = getNextPhoto();
  const img = document.createElement("img");

  const width = 52 + Math.random() * 43;
  const rotation = -16 + Math.random() * 32;
  const duration = 12 + Math.random() * 8;
  const drift = -65 + Math.random() * 130;

  img.className = "falling-photo";
  img.alt = "";
  img.draggable = false;

  img.style.left = (3 + Math.random() * 88) + "%";

  img.style.setProperty("--photo-width", width + "px");
  img.style.setProperty("--rotation", rotation + "deg");
  img.style.setProperty("--fall-duration", duration + "s");
  img.style.setProperty("--drift", drift + "px");

  img.onload = function() {
    img.style.visibility = "visible";
  };

  img.onerror = function() {
    console.warn("Could not display photo:", filename);
    img.remove();
  };

  img.src = "./" + encodeURIComponent(filename);

  img.addEventListener("animationend", function() {
    img.remove();
  });

  photos.appendChild(img);
}

/* START PHOTOS */

function startPhotos() {

  if (photoTimer) return;

  validatePhotos().then(function() {

    if (availablePhotoFiles.length === 0) {
      console.warn("No photos could be loaded.");
      return;
    }

    for (let i = 0; i < 4; i++) {
      setTimeout(createFallingPhoto, i * 850);
    }

    photoTimer = setInterval(createFallingPhoto, 2300);
  });
}

/* START */

makeStars();

</script>
</body>
</html>
