<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090511;
}

body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 45%, #38234e 0%, #21132f 42%, #100a1c 75%, #080510 100%);
}

/* GALAXY / NEBULA CLOUDS */

.nebula {
  position: absolute;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 22% 22%, rgba(143,91,183,.38) 0%, transparent 32%),
    radial-gradient(ellipse at 72% 18%, rgba(91,65,143,.42) 0%, transparent 34%),
    radial-gradient(ellipse at 80% 52%, rgba(164,105,194,.27) 0%, transparent 30%),
    radial-gradient(ellipse at 26% 65%, rgba(109,70,153,.34) 0%, transparent 36%),
    radial-gradient(ellipse at 55% 88%, rgba(129,77,164,.28) 0%, transparent 34%),
    radial-gradient(ellipse at 48% 38%, rgba(91,55,125,.25) 0%, transparent 40%);
  filter: blur(25px);
  opacity: .95;
  animation: nebulaDrift 38s ease-in-out infinite alternate;
}

.nebula::before,
.nebula::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.nebula::before {
  background:
    radial-gradient(ellipse at 15% 48%, rgba(192,137,218,.19) 0%, transparent 22%),
    radial-gradient(ellipse at 62% 28%, rgba(171,123,210,.20) 0%, transparent 24%),
    radial-gradient(ellipse at 88% 76%, rgba(117,87,173,.22) 0%, transparent 28%),
    radial-gradient(ellipse at 39% 92%, rgba(177,117,199,.16) 0%, transparent 25%);
  filter: blur(42px);
}

.nebula::after {
  background:
    radial-gradient(ellipse at 35% 35%, rgba(255,210,255,.08) 0%, transparent 18%),
    radial-gradient(ellipse at 75% 60%, rgba(213,171,255,.09) 0%, transparent 20%),
    radial-gradient(ellipse at 18% 82%, rgba(192,143,255,.08) 0%, transparent 22%);
  filter: blur(55px);
}

@keyframes nebulaDrift {
  0% { transform: translate3d(-2%, -1%, 0) scale(1); }
  50% { transform: translate3d(2%, 1%, 0) scale(1.07); }
  100% { transform: translate3d(-1%, 2%, 0) scale(1.03); }
}

/* BACKGROUND STARS */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 7px 1px rgba(255,255,255,.85);
  animation: twinkle 3s ease-in-out infinite;
}

.star.bright {
  width: 3px;
  height: 3px;
  box-shadow:
    0 0 5px 2px rgba(255,255,255,.9),
    0 0 14px 4px rgba(209,177,255,.65);
}

.star.cross {
  width: 3px;
  height: 3px;
  box-shadow:
    0 0 5px 2px white,
    0 0 15px 4px rgba(220,190,255,.9);
}

.star.cross::before,
.star.cross::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  background: rgba(255,255,255,.9);
  transform: translate(-50%,-50%);
  border-radius: 50%;
}

.star.cross::before {
  width: 1px;
  height: 18px;
}

.star.cross::after {
  width: 18px;
  height: 1px;
}

@keyframes twinkle {
  0%, 100% { opacity: .25; transform: scale(.7); }
  50% { opacity: 1; transform: scale(1.5); }
}

/* SHOOTING STARS */

.shooting-star {
  position: absolute;
  width: 150px;
  height: 2px;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  transform: rotate(-35deg);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(220,195,255,.35) 30%,
    rgba(255,255,255,.95) 88%,
    transparent
  );
  filter: drop-shadow(0 0 5px rgba(220,190,255,.8));
  animation: shooting 8s ease-in-out infinite;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 12%;
  top: -2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 10px 4px rgba(255,255,255,.8);
}

@keyframes shooting {
  0% {
    opacity: 0;
    transform: translate(100px,-40px) rotate(-35deg);
  }
  4% { opacity: 1; }
  17% { opacity: 0; }
  100% {
    opacity: 0;
    transform: translate(-420px,300px) rotate(-35deg);
  }
}

/* OPENING SCREEN */

#opening {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.5s ease;
}

.opening-content {
  position: relative;
  z-index: 2;
  padding: 25px;
  width: 100%;
  max-width: 500px;
}

.opening-eyebrow {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.8);
  margin-bottom: 30px;
}

.opening-moon {
  font-size: 54px;
  margin-bottom: 15px;
  color: #e8d7ff;
  filter: drop-shadow(0 0 15px rgba(220,190,255,.65));
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(48px, 13vw, 76px);
  line-height: 1.1;
  font-weight: 400;
  color: #fff;
  text-shadow: 0 0 18px rgba(220,190,255,.35);
}

.opening-subtitle {
  margin-top: 18px;
  font-size: 19px;
  color: rgba(255,255,255,.9);
  letter-spacing: 1px;
}

.open-button {
  margin-top: 40px;
  padding: 15px 28px;
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 40px;
  background: rgba(255,255,255,.09);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: background .3s ease, transform .3s ease;
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.2);
}

/* MAIN SCREEN */

#main {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

#photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

/* FLOATING POLAROIDS */

.falling-photo-frame {
  position: absolute;
  top: -180px;
  opacity: 0;
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform;
}

.falling-photo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  border: 8px solid white;
  padding: 7px;
  background: white;
  border-radius: 3px;
  box-shadow:
    0 5px 22px rgba(0,0,0,.38),
    0 0 10px rgba(230,210,255,.12);
}

/* CELESTIAL BORDER ART */

.photo-decoration-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}

.photo-decoration-layer svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,-10px,0) rotate(var(--rotation));
  }
  3% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift),110vh,0)
      rotate(calc(var(--rotation) + 25deg));
  }
}

/* CENTER MESSAGE AND HEART */

.center-message {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 100%;
  max-width: 100%;
  padding: 0 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(5px, 1.5vw, 14px);
  pointer-events: none;
}

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(31px, 8.5vw, 76px);
  line-height: 1;
  font-weight: 400;
  color: white;
  white-space: nowrap;
  text-align: center;
  text-shadow:
    0 0 2px #fff,
    0 0 6px #fff,
    0 0 13px rgba(255,255,255,.98),
    0 0 25px rgba(220,190,255,.95),
    0 0 42px rgba(190,145,255,.85),
    0 0 65px rgba(160,115,230,.65);
}

.white-heart {
  display: block;
  width: clamp(25px, 7vw, 65px);
  height: auto;
  flex: 0 0 auto;
  fill: white;
  filter:
    drop-shadow(0 0 2px #fff)
    drop-shadow(0 0 7px #fff)
    drop-shadow(0 0 15px rgba(255,255,255,.95))
    drop-shadow(0 0 28px rgba(220,190,255,.95))
    drop-shadow(0 0 48px rgba(190,145,255,.8));
}

/* HIDDEN YOUTUBE PLAYER */

#youtube-player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -10000px;
  top: -10000px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

#youtube-player-container iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

/* SMALL SCREENS */

@media (max-width: 380px) {
  .opening-subtitle { font-size: 17px; }
  .opening-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
  }

  .center-message {
    padding-left: 9px;
    padding-right: 9px;
    gap: 4px;
  }

  .message-text {
    font-size: clamp(28px, 8.1vw, 34px);
  }

  .white-heart {
    width: 25px;
  }
}

@media (min-width: 600px) {
  .message-text {
    font-size: clamp(55px, 7.5vw, 90px);
  }

  .white-heart {
    width: clamp(45px, 6vw, 75px);
  }
}
</style>

/* BACKGROUND STARS */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");
    const chance = Math.random();

    star.className = "star";

    if (chance > 0.94) {
      star.classList.add("cross");
    } else if (chance > 0.78) {
      star.classList.add("bright");
    }

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 6 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";

    container.appendChild(star);
  }
}

createStars("opening-stars", 170);
createStars("main-stars", 210);

/* PHOTO SHUFFLE / NO REPEATS */

const photos = document.getElementById("photos");

let photoDeck = [];
let lastDisplayedPhoto = null;
let failedPhotos = new Set();
let photoStarted = false;
let photoTimer = null;
let pendingPhotos = 0;

const unavailablePhotos = new Set([
  "IMG_4101_Original.jpeg",
  "wedding-photo-12.png"
]);

const photoRetryCounts = new Map();
const MAX_PHOTO_RETRIES = 2;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function startNewPhotoCycle() {
  const availablePhotos = photoFiles.filter(
    filename =>
      !unavailablePhotos.has(filename) &&
      !failedPhotos.has(filename)
  );

  photoDeck = shuffle(availablePhotos);

  if (
    photoDeck.length > 1 &&
    photoDeck[0] === lastDisplayedPhoto
  ) {
    [photoDeck[0], photoDeck[1]] =
      [photoDeck[1], photoDeck[0]];
  }

  photoRetryCounts.clear();

  console.log(
    "Starting photo cycle with",
    photoDeck.length,
    "available photos."
  );
}

function getNextPhoto() {
  if (photoDeck.length === 0) {
    if (pendingPhotos > 0) return null;
    startNewPhotoCycle();
  }

  if (photoDeck.length === 0) return null;

  return photoDeck.shift();
}

/* RANDOM PHOTO DIMENSIONS */

function getRandomPhotoSize() {
  const sizes = [
    { width: 78, height: 98 },
    { width: 88, height: 110 },
    { width: 98, height: 122 },
    { width: 108, height: 135 },
    { width: 118, height: 148 },
    { width: 128, height: 160 }
  ];

  const selected = sizes[
    Math.floor(Math.random() * sizes.length)
  ];

  const maxWidth = Math.max(70, window.innerWidth - 20);
  const scale = Math.min(1, maxWidth / selected.width);

  return {
    width: Math.round(selected.width * scale),
    height: Math.round(selected.height * scale)
  };
}

      Q ${x+1.2} ${y-1.2} ${x+r} ${y}
      Q ${x+1.2} ${y+1.2} ${x} ${y+r}
      Q ${x-1.2} ${y+1.2} ${x-r} ${y}
      Q ${x-1.2} ${y-1.2} ${x} ${y-r}
      Z
    `;
  };

  const sparklePath = (x, y, r) => {
    return `
      M ${x} ${y-r}
      Q ${x+0.7} ${y-0.7} ${x+r} ${y}
      Q ${x+0.7} ${y+0.7} ${x} ${y+r}
      Q ${x-0.7} ${y+0.7} ${x-r} ${y}
      Q ${x-0.7} ${y-0.7} ${x} ${y-r}
      Z
    `;
  };

  let art = `
    <svg viewBox="0 0 128 160" preserveAspectRatio="none"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">

      <defs>
        <filter id="lavenderGlow">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
  `;

  /* CRESCENT MOON */

  const moonPositions = {
    "top-left": [17,18],
    "top-right": [111,18],
    "bottom-left": [17,142],
    "bottom-right": [111,142]
  };

  const [mx,my] = moonPositions[pattern.moon];

  art += `
    <path
      d="M ${mx+5} ${my-10}
         C ${mx-8} ${my-7}, ${mx-8} ${my+8}, ${mx+5} ${my+10}
         C ${mx-1} ${my+3}, ${mx-1} ${my-3}, ${mx+5} ${my-10} Z"
      fill="#b28bdc"
      stroke="#8f68bd"
      stroke-width="1.1"
      filter="url(#lavenderGlow)"
    />
    <path
      d="M ${mx+4} ${my-7}
         C ${mx-3} ${my-4}, ${mx-3} ${my+4}, ${mx+4} ${my+7}"
      fill="none"
      stroke="#eadcff"
      stroke-width=".8"
      opacity=".9"
    />
  `;

  /* LARGE FOUR-POINT STARS */

  pattern.stars.forEach(([x,y,r], index) => {
    art += `
      <path d="${starPath(x,y,r)}"
        fill="${index % 2 === 0 ? "#a77bcf" : "#c4a3e8"}"
        stroke="#8e69b9"
        stroke-width=".65"
        filter="url(#lavenderGlow)"
      />
    `;
  });

  /* SMALL SPARKLES */

  pattern.sparkles.forEach(([x,y,r]) => {
    art += `
      <path d="${sparklePath(x,y,r)}"
        fill="#d9c4f2"
        opacity=".95"
      />
    `;
  });

  /* A FEW FRAMES GET EXTRA TINY GLINTS */

  if (Math.random() < .55) {
    const extra = [
      [34,13],[92,14],[13,104],[115,108],[43,150],[86,149]
    ];

    const chosen = extra[
      Math.floor(Math.random() * extra.length)
    ];

    art += `
      <path d="${sparklePath(chosen[0],chosen[1],2.1)}"
        fill="#f0e5ff"
        opacity=".95"
      />
    `;
  }

  art += `</svg>`;

  layer.innerHTML = art;
}

/* CREATE FALLING PHOTO */

function createFallingPhoto() {
  const filename = getNextPhoto();

  if (!filename) return;

  const frame = document.createElement("div");
  const img = document.createElement("img");
  const decorationLayer = document.createElement("div");

  const rotation = -16 + Math.random() * 32;
  const duration = 35 + Math.random() * 10;
  const drift = -65 + Math.random() * 130;
  const size = getRandomPhotoSize();

  frame.className = "falling-photo-frame";
  frame.style.width = size.width + "px";
  frame.style.height = size.height + "px";

  const availableWidth = Math.max(0, window.innerWidth - size.width);
  frame.style.left = (Math.random() * availableWidth) + "px";

  frame.style.setProperty("--rotation", rotation + "deg");
  frame.style.setProperty("--fall-duration", duration + "s");
  frame.style.setProperty("--drift", drift + "px");

  img.className = "falling-photo-image";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  decorationLayer.className = "photo-decoration-layer";

  addPhotoDecorations(decorationLayer);

  frame.appendChild(img);
  frame.appendChild(decorationLayer);

  pendingPhotos++;

  img.onload = () => {
    pendingPhotos--;

    photoRetryCounts.delete(filename);
    lastDisplayedPhoto = filename;

    photos.appendChild(frame);

    console.log("Photo displayed:", filename);
  };

  img.onerror = () => {
    pendingPhotos--;

    const retries = photoRetryCounts.get(filename) || 0;

    if (retries < MAX_PHOTO_RETRIES) {
      photoRetryCounts.set(filename, retries + 1);
      photoDeck.push(filename);

      console.warn(
        "Retrying photo:",
        filename,
        "Attempt:",
        retries + 1
      );
    } else {
      failedPhotos.add(filename);
      photoRetryCounts.delete(filename);

      console.warn(
        "Skipping photo after retries:",
        filename
      );
    }

    frame.remove();
  };

  frame.addEventListener("animationend", () => {
    frame.remove();
  });

  img.src = "./" + encodeURIComponent(filename);
}

/* PHOTO START SEQUENCE */

function startPhotos() {
  if (photoStarted) return;

  photoStarted = true;

  createFallingPhoto();

  setTimeout(createFallingPhoto, 1500);
  setTimeout(createFallingPhoto, 3000);

  setTimeout(() => {
    createFallingPhoto();
    photoTimer = setInterval(createFallingPhoto, 5000);
  }, 8000);
}

/* HIDDEN YOUTUBE PLAYER WITH AUTOPLAY AND LOOP */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubePlayerReady = false;
let startMusicWhenReady = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: "200",
    height: "200",
    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: videoId
    },

    events: {
      onReady: function(event) {
        youtubePlayerReady = true;

        if (startMusicWhenReady) {
          event.target.playVideo();
          startMusicWhenReady = false;
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.playVideo();
        }
      }
    }
  });
}

/* LOAD YOUTUBE API */

(function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* OPEN SURPRISE */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {

  if (youtubePlayer && youtubePlayerReady) {
    youtubePlayer.playVideo();
  } else {
    startMusicWhenReady = true;
  }

  opening.style.opacity = "0";

  setTimeout(() => {
    opening.style.display = "none";
    main.style.display = "block";

    requestAnimationFrame(() => {
      main.style.opacity = "1";
    });

    startPhotos();
  }, 1000);
});
