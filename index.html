
<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavender Midnight</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0c0817;
}

body {
  font-family: 'Cormorant Garamond', serif;
  color: white;
}

.screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 45%, #30213f 0%, #1b142a 48%, #0c0817 100%);
}

/* =====================================
   VISIBLE LAVENDER NEBULA CLOUDS
===================================== */

.nebula-clouds {
  position: absolute;
  inset: -25%;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: 1;
}

.nebula-clouds span {
  position: absolute;
  display: block;
  border-radius: 50%;
  filter: blur(48px);
  mix-blend-mode: screen;
  will-change: transform;
}

.cloud-one {
  width: 75%;
  height: 35%;
  left: -5%;
  top: 15%;
  background: radial-gradient(ellipse, rgba(154,111,194,.43), rgba(117,77,163,.22) 43%, transparent 74%);
  transform: rotate(-24deg);
  animation: cloudDriftOne 32s ease-in-out infinite alternate;
}

.cloud-two {
  width: 72%;
  height: 42%;
  right: -8%;
  top: 30%;
  background: radial-gradient(ellipse, rgba(119,103,190,.40), rgba(105,76,157,.22) 45%, transparent 75%);
  transform: rotate(28deg);
  animation: cloudDriftTwo 39s ease-in-out infinite alternate;
}

.cloud-three {
  width: 78%;
  height: 35%;
  left: 15%;
  bottom: 3%;
  background: radial-gradient(ellipse, rgba(173,119,192,.34), rgba(121,81,166,.20) 45%, transparent 76%);
  transform: rotate(-15deg);
  animation: cloudDriftThree 36s ease-in-out infinite alternate;
}

.cloud-four {
  width: 58%;
  height: 32%;
  left: 32%;
  top: 3%;
  background: radial-gradient(ellipse, rgba(177,143,211,.27), rgba(125,91,173,.14) 48%, transparent 76%);
  transform: rotate(18deg);
  animation: cloudDriftOne 44s ease-in-out infinite alternate-reverse;
}

.cloud-five {
  width: 65%;
  height: 30%;
  left: -12%;
  bottom: 12%;
  background: radial-gradient(ellipse, rgba(111,104,181,.32), rgba(92,76,153,.16) 48%, transparent 76%);
  transform: rotate(32deg);
  animation: cloudDriftTwo 42s ease-in-out infinite alternate-reverse;
}

@keyframes cloudDriftOne {
  from { translate: -3% -2%; scale: .95; }
  to { translate: 5% 4%; scale: 1.13; }
}

@keyframes cloudDriftTwo {
  from { translate: 3% 2%; scale: 1.05; }
  to { translate: -5% -3%; scale: .92; }
}

@keyframes cloudDriftThree {
  from { translate: -2% 3%; scale: .94; }
  to { translate: 4% -3%; scale: 1.12; }
}

/* Soft, wispy cloud detail */

.nebula-haze {
  position: absolute;
  inset: -15%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 22% 38%, rgba(202,167,226,.13), transparent 24%),
    radial-gradient(ellipse at 73% 30%, rgba(171,148,224,.15), transparent 27%),
    radial-gradient(ellipse at 57% 78%, rgba(190,143,211,.13), transparent 25%),
    radial-gradient(ellipse at 8% 78%, rgba(130,116,194,.12), transparent 25%);
  filter: blur(30px);
  animation: hazeMove 38s ease-in-out infinite alternate;
}

@keyframes hazeMove {
  from { transform: translate(-2%, 1%) scale(1); }
  to { transform: translate(3%, -2%) scale(1.1); }
}

/* =====================================
   BACKGROUND STARS
===================================== */

.stars {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 7px 1px rgba(255,255,255,.8);
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .2; transform: scale(.75); }
  50% { opacity: 1; transform: scale(1.6); }
}

.sky-sparkle {
  position: absolute;
  width: 9px;
  height: 9px;
  background: rgba(245,236,255,.95);
  clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
  filter: drop-shadow(0 0 5px rgba(231,213,255,.9));
  animation: sparklePulse 3.5s ease-in-out infinite;
}

@keyframes sparklePulse {
  0%, 100% { opacity: .25; transform: scale(.7) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.2) rotate(20deg); }
}

/* =====================================
   SHOOTING STARS IN THE SKY
===================================== */

.shooting-star {
  position: absolute;
  z-index: 2;
  width: 155px;
  height: 1.5px;
  opacity: 0;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(226,211,255,.25), white, transparent);
  transform: rotate(-35deg);
  filter: drop-shadow(0 0 5px rgba(226,211,255,.9));
  animation: shooting 8s ease-in-out infinite;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: 20px;
  top: -2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 9px 3px rgba(255,255,255,.8);
}

@keyframes shooting {
  0%, 72% { opacity: 0; transform: translate(0,0) rotate(-35deg); }
  74% { opacity: 1; }
  82%, 100% { opacity: 0; transform: translate(-330px,210px) rotate(-35deg); }
}

/* =====================================
   OPENING SCREEN
===================================== */

#opening {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.5s ease;
}

.opening-content {
  position: relative;
  z-index: 3;
  padding: 25px;
  width: 100%;
  max-width: 500px;
}

.opening-eyebrow {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.78);
  margin-bottom: 30px;
}

.moon {
  font-size: 50px;
  margin-bottom: 15px;
  color: #eee3ff;
  filter: drop-shadow(0 0 15px rgba(218,195,255,.65));
}

.opening-title {
  font-family: 'Allura', cursive;
  font-size: clamp(48px, 13vw, 76px);
  line-height: 1.1;
  font-weight: 400;
  color: white;
  text-shadow: 0 0 18px rgba(221,201,255,.3);
}

.opening-subtitle {
  margin-top: 18px;
  font-size: 19px;
  letter-spacing: 1px;
  color: rgba(255,255,255,.88);
}

.open-button {
  margin-top: 40px;
  padding: 15px 28px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 40px;
  background: rgba(255,255,255,.08);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: background .3s ease, transform .3s ease;
}

.open-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.18);
}

/* =====================================
   MAIN SCREEN AND PHOTOS
===================================== */

#main {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

#photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 3;
}

/* Polaroid has a real white frame and bottom margin */

.falling-photo-frame {
  position: absolute;
  top: -170px;
  opacity: 0;
  padding: 6px 6px 23px;
  background: #fff;
  border-radius: 2px;
  box-shadow: 0 4px 18px rgba(10,5,20,.45);
  animation: fall var(--fall-duration) linear forwards;
  will-change: transform;
}

.falling-photo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  border: 0;
  padding: 0;
  background: white;
  border-radius: 0;
}

/* The SVG overlay only decorates the white frame margins */

.photo-decoration-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}

.photo-decoration-layer svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

@keyframes fall {
  0% {
    opacity: 0;
    transform: translate3d(0,-10px,0) rotate(var(--rotation));
  }
  3% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift),110vh,0) rotate(calc(var(--rotation) + 25deg));
  }
}

/* =====================================
   CENTER MESSAGE
===================================== */

.center-message {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 20px);
  max-width: 520px;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}

.message-text {
  font-family: 'Allura', cursive;
  font-size: clamp(25px, 7.1vw, 48px);
  line-height: 1.12;
  font-weight: 400;
  color: white;
  white-space: nowrap;
  text-shadow:

    0 0 5px #fff,
    0 0 11px rgba(255,255,255,.95),
    0 0 22px rgba(255,255,255,.85),
    0 0 38px rgba(220,205,255,.8),
    0 0 60px rgba(190,160,255,.55);

.white-heart {

    drop-shadow(0 0 22px rgba(255,255,255,.85))
    drop-shadow(0 0 38px rgba(190,160,255,.65));
}

/* =====================================
   HIDDEN YOUTUBE PLAYER
===================================== */

#youtube-player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -10000px;
  top: -10000px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

#youtube-player-container iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

/* SMALL SCREENS */

@media (max-width: 380px) {
  .opening-subtitle { font-size: 17px; }

  .opening-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
  }

    width: calc(100% - 12px);
    gap: 3px;
  }

  .message-text {
    font-size: clamp(23px, 6.9vw, 27px);
  }

  .white-heart { width: 19px; }
}
</style>
</head>

/* BACKGROUND STARS */

function createStars(containerId, count) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 5 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";

    if (Math.random() < .16) {
      star.style.width = "3px";
      star.style.height = "3px";
      star.style.boxShadow = "0 0 10px 2px rgba(255,255,255,.85)";
    }

    container.appendChild(star);
  }

  for (let i = 0; i < 15; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sky-sparkle";
    sparkle.style.left = Math.random() * 100 + "%";
    sparkle.style.top = Math.random() * 100 + "%";
    sparkle.style.animationDelay = Math.random() * 5 + "s";
    sparkle.style.animationDuration = (2.5 + Math.random() * 3) + "s";
    container.appendChild(sparkle);
  }
}

createStars("opening-stars", 125);

/* PHOTO SHUFFLE / NO REPEATS */

const photos = document.getElementById("photos");

let photoDeck = [];
let lastDisplayedPhoto = null;
let failedPhotos = new Set();
let photoStarted = false;
let photoTimer = null;
let pendingPhotos = 0;

const unavailablePhotos = new Set([
  "IMG_4101_Original.jpeg",
  "wedding-photo-12.png"
]);

const photoRetryCounts = new Map();
const MAX_PHOTO_RETRIES = 2;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function startNewPhotoCycle() {
  const availablePhotos = photoFiles.filter(
    filename =>
      !unavailablePhotos.has(filename) &&
      !failedPhotos.has(filename)
  );

  photoDeck = shuffle(availablePhotos);

  if (photoDeck.length > 1 && photoDeck[0] === lastDisplayedPhoto) {
    [photoDeck[0], photoDeck[1]] = [photoDeck[1], photoDeck[0]];
  }

  photoRetryCounts.clear();

  console.log("Starting photo cycle with", photoDeck.length, "available photos.");
}

function getNextPhoto() {
  if (photoDeck.length === 0) {
    if (pendingPhotos > 0) return null;
    startNewPhotoCycle();
  }

  if (photoDeck.length === 0) return null;

  return photoDeck.shift();
}

/* RANDOM PHOTO SIZES */

function getRandomPhotoSize() {
  const sizes = [
    { width: 78, height: 98 },
    { width: 88, height: 110 },
    { width: 98, height: 122 },
    { width: 108, height: 135 },
    { width: 118, height: 148 },
    { width: 128, height: 160 }
  ];

  const selected = sizes[Math.floor(Math.random() * sizes.length)];
  const maxWidth = Math.max(70, window.innerWidth - 20);
  const scale = Math.min(1, maxWidth / selected.width);

  return {
    width: Math.round(selected.width * scale),
    height: Math.round(selected.height * scale)
  };
}

    <path d="
      M ${x} ${y-s}

      C ${x} ${y+s} ${x-1} ${y+1}
        ${x-s} ${y}
      C ${x-1} ${y-1} ${x} ${y-s}
      Z"
      fill="#b69bdc"
      opacity="${opacity}"/>
  `;

  const sparkle = (x, y, s, opacity = .9) => `
    <path d="
      M ${x} ${y-s}
      L ${x+1} ${y-1}
      L ${x+s} ${y}
      L ${x+1} ${y+1}
      L ${x} ${y+s}
      L ${x-1} ${y+1}
      L ${x-s} ${y}
      L ${x-1} ${y-1}
      Z"
      fill="#d5c2ef"
      opacity="${opacity}"/>
  `;

  const moon = (x, y, scale, flip = false) => `
    <g transform="translate(${x} ${y}) scale(${flip ? -scale : scale},${scale})">
      <path
        d="M 1 -8
           C -7 -7 -10 1 -5 7
           C 0 12 8 8 10 1
           C 5 6 0 4 -2 0
           C -4 -4 -2 -7 1 -8 Z"
        fill="#b59bdc"
        stroke="#e6d9f7"
        stroke-width=".65"
      />
    </g>
  `;

  const shooting = (x, y, angle = -18) => `
    <g transform="translate(${x} ${y}) rotate(${angle})">
      <path d="M -13 0 Q -5 -1 0 0"
        stroke="#bba4df"
        stroke-width=".8"
        stroke-linecap="round"
        opacity=".8"
        fill="none"/>
      <circle cx="1" cy="0" r="1.5" fill="#f2eaff"/>
      <circle cx="1" cy="0" r="2.7" fill="#d5c2ef" opacity=".35"/>
    </g>
  `;

  /*
    Fine curved paths connect a few small details.
    All paths stay within the white border areas.
  */

  const patterns = [

    () => `
      <path d="M 24 8 Q 39 2 53 8" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      <path d="M 72 151 Q 88 145 104 151" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      ${moon(14,151,.78)}
      ${star(39,8,3.2)}
      ${sparkle(58,8,2.2)}
      ${star(85,151,3.2)}
      ${sparkle(108,151,2.4)}
      ${shooting(104,8,-12)}
    `,

    () => `
      <path d="M 22 151 Q 39 145 55 151" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      <path d="M 73 8 Q 89 2 105 8" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      ${moon(113,8,.78,true)}
      ${star(87,8,3.2)}
      ${sparkle(65,8,2.2)}
      ${star(41,151,3.2)}
      ${sparkle(18,151,2.4)}
      ${shooting(22,8,12)}
    `,

    () => `
      <path d="M 23 8 Q 40 2 55 8" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      <path d="M 70 151 Q 86 145 103 151" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      ${moon(14,8,.72)}
      ${star(40,8,3.2)}
      ${sparkle(61,8,2.2)}
      ${star(86,151,3.1)}
      ${sparkle(108,151,2.4)}
      ${shooting(101,151,-15)}
    `,

    () => `
      <path d="M 23 151 Q 40 145 55 151" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      <path d="M 72 8 Q 89 2 104 8" stroke="#c4afe2" stroke-width=".55" fill="none" opacity=".55"/>
      ${moon(113,151,.72,true)}
      ${star(88,151,3.2)}
      ${sparkle(64,151,2.2)}
      ${star(41,8,3.1)}
      ${sparkle(18,8,2.4)}
      ${shooting(25,151,15)}
    `
  ];

  const selectedPattern = patterns[Math.floor(Math.random() * patterns.length)];

  layer.innerHTML = `
    <svg viewBox="0 0 128 160"
         preserveAspectRatio="none"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      ${selectedPattern()}
    </svg>
  `;
}

/* CREATE FALLING PHOTO */

function createFallingPhoto() {
  const filename = getNextPhoto();
  if (!filename) return;

  const frame = document.createElement("div");
  const img = document.createElement("img");
  const decorationLayer = document.createElement("div");

  const rotation = -16 + Math.random() * 32;
  const duration = 35 + Math.random() * 10;
  const drift = -65 + Math.random() * 130;
  const size = getRandomPhotoSize();

  frame.className = "falling-photo-frame";
  frame.style.width = size.width + "px";
  frame.style.height = size.height + "px";

  const availableWidth = Math.max(0, window.innerWidth - size.width);
  frame.style.left = Math.random() * availableWidth + "px";

  frame.style.setProperty("--rotation", rotation + "deg");
  frame.style.setProperty("--fall-duration", duration + "s");
  frame.style.setProperty("--drift", drift + "px");

  img.className = "falling-photo-image";
  img.alt = "";
  img.draggable = false;
  img.loading = "eager";

  decorationLayer.className = "photo-decoration-layer";
  addPhotoDecorations(decorationLayer);

  frame.appendChild(img);
  frame.appendChild(decorationLayer);

  pendingPhotos++;

  img.onload = () => {
    pendingPhotos--;
    photoRetryCounts.delete(filename);
    lastDisplayedPhoto = filename;
    photos.appendChild(frame);
    console.log("Photo displayed:", filename);
  };

  img.onerror = () => {
    pendingPhotos--;

    const retries = photoRetryCounts.get(filename) || 0;

    if (retries < MAX_PHOTO_RETRIES) {
      photoRetryCounts.set(filename, retries + 1);
      photoDeck.push(filename);
      console.warn("Retrying photo:", filename, "Attempt:", retries + 1);
    } else {
      failedPhotos.add(filename);
      photoRetryCounts.delete(filename);
      console.warn("Skipping photo after retries:", filename);
    }

    frame.remove();
  };

  frame.addEventListener("animationend", () => frame.remove());

  img.src = "./" + encodeURIComponent(filename);
}

/* PHOTO START SEQUENCE */

function startPhotos() {
  if (photoStarted) return;

  photoStarted = true;

  createFallingPhoto();
  setTimeout(createFallingPhoto, 1500);
  setTimeout(createFallingPhoto, 3000);

  setTimeout(() => {
    createFallingPhoto();
    photoTimer = setInterval(createFallingPhoto, 5000);
  }, 8000);
}

/* HIDDEN YOUTUBE PLAYER */

const videoId = "yLZoVTayvxY";

let youtubePlayer = null;
let youtubePlayerReady = false;
let startMusicWhenReady = false;

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: "200",
    height: "200",
    videoId: videoId,
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: videoId
    },
    events: {
      onReady: function(event) {
        youtubePlayerReady = true;

        if (startMusicWhenReady) {
          event.target.playVideo();
          startMusicWhenReady = false;
        }
      },
      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          event.target.playVideo();
        }
      }
    }
  });
}

/* LOAD YOUTUBE API */

(function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";

  const firstScript = document.getElementsByTagName("script")[0];
  firstScript.parentNode.insertBefore(tag, firstScript);
})();

/* OPEN SURPRISE */

const opening = document.getElementById("opening");
const main = document.getElementById("main");
const openButton = document.getElementById("open-button");

openButton.addEventListener("click", function() {
  if (youtubePlayer && youtubePlayerReady) {
    youtubePlayer.playVideo();
  } else {
    startMusicWhenReady = true;
  }

  opening.style.opacity = "0";

  setTimeout(() => {
    opening.style.display = "none";
    main.style.display = "block";

    requestAnimationFrame(() => {
      main.style.opacity = "1";
    });

    startPhotos();
  }, 1000);
});
