<script>

/* =========================================================
   MUSIC — PRE-INITIALIZED YOUTUBE PLAYER
   Song ID: 1e-XYTmG7Fk
========================================================= */

const videoId = "1e-XYTmG7Fk";

let youtubePlayer = null;
let youtubeReady = false;
let musicRequested = false;
let playerCreationStarted = false;

/* Initialize the player as early as possible */
function createYouTubePlayer() {

  if (
    playerCreationStarted ||
    youtubePlayer ||
    !window.YT ||
    !window.YT.Player
  ) return;

  playerCreationStarted = true;

  youtubePlayer = new YT.Player("youtube-player", {

    height: "200",
    width: "200",
    videoId: videoId,

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      loop: 1,
      playlist: videoId,
      modestbranding: 1,
      rel: 0,
      enablejsapi: 1,
      origin: window.location.origin
    },

    events: {

      onReady: function(event) {

        youtubeReady = true;

        event.target.cueVideoById(videoId);

        if (musicRequested) {
          event.target.playVideo();
        }

      },

      onStateChange: function(event) {

        if (event.data === YT.PlayerState.ENDED) {
          event.target.seekTo(0, true);
          event.target.playVideo();
        }

      },

      onError: function(event) {
        console.warn("YouTube player error:", event.data);
      }

    }

  });

}

/* YouTube API ready callback */
window.onYouTubeIframeAPIReady = createYouTubePlayer;

/* Load YouTube API once */
(function loadYouTubeAPI() {

  if (window.YT && window.YT.Player) {
    createYouTubePlayer();
    return;
  }

  if (
    document.querySelector(
      'script[src="https://www.youtube.com/iframe_api"]'
    )
  ) {
    return;
  }

  const tag = document.createElement("script");

  tag.src = "https://www.youtube.com/iframe_api";
  tag.async = true;

  const firstScript = document.getElementsByTagName("script")[0];

  if (firstScript && firstScript.parentNode) {
    firstScript.parentNode.insertBefore(tag, firstScript);
  } else {
    document.head.appendChild(tag);
  }

})();

/* =========================================================
   OPENING BUTTON
========================================================= */

document.getElementById("open-button").addEventListener("click", function() {

  musicRequested = true;

  /* Start music directly from the user's tap */
  if (youtubeReady && youtubePlayer) {

    youtubePlayer.loadVideoById({
      videoId: videoId,
      startSeconds: 0
    });

    youtubePlayer.playVideo();

  }

  document.getElementById("opening").classList.add("hidden");

  document.getElementById("main-screen").classList.remove("hidden");

  startPhotos();

});

</script>
