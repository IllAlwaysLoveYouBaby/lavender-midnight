
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavender Midnight Photo Checker</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #21182f;
  color: white;
  padding: 20px;
}
main {
  max-width: 700px;
  margin: auto;
}
button {
  padding: 14px 20px;
  border: 0;
  border-radius: 8px;
  background: #e7c8f1;
  color: #21182f;
  font-size: 16px;
  font-weight: bold;
}
button:disabled {
  opacity: 0.5;
}
.good { color: #9ce6b1; }
.bad { color: #ffaaaa; }
li {
  margin: 8px 0;
  overflow-wrap: anywhere;
}
#status {
  margin: 20px 0;
}
</style>
</head>
<body>
<main>
<h1>Lavender Midnight Photo Checker</h1>
<p>This checks every photo listed in your live website.</p>

<button id="checkButton">Check All Photos</button>

<div id="status">Ready to check.</div>
<div id="summary"></div>
<div id="results"></div>
</main>

<script>
(function () {
  var button = document.getElementById("checkButton");
  var status = document.getElementById("status");
  var summary = document.getElementById("summary");
  var results = document.getElementById("results");

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c];
    });
  }

  function getPhotoNames(source) {
    var start = source.indexOf("photoFiles");
    if (start === -1) {
      throw new Error("Could not find photoFiles in index.html.");
    }

    var open = source.indexOf("[", start);
    var close = source.indexOf("];", open);

    if (open === -1 || close === -1) {
      throw new Error("Could not read the photo list.");
    }

    var section = source.substring(open + 1, close);
    var matches = section.match(/(["'])(.*?)\1/g);

    if (!matches || matches.length === 0) {
      throw new Error("No photo filenames were found.");
    }

    return matches.map(function (item) {
      return item.substring(1, item.length - 1);
    });
  }

  function checkOne(name, callback) {
    var photo = new Image();

    photo.onload = function () {
      callback(true);
    };

    photo.onerror = function () {
      callback(false);
    };

    photo.src = "./" + encodeURIComponent(name);
  }

  button.onclick = function () {
    button.disabled = true;
    status.textContent = "Reading your website's photo list...";
    summary.innerHTML = "";
    results.innerHTML = "";

    var request = new XMLHttpRequest();

    request.open("GET", "./index.html", true);
    request.onload = function () {
      if (request.status < 200 || request.status >= 300) {
        status.textContent = "Unable to read index.html. HTTP " + request.status;
        button.disabled = false;
        return;
      }

      var names;

      try {
        names = getPhotoNames(request.responseText);
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
        return;
      }

      var loaded = [];
      var failed = [];
      var position = 0;

      status.textContent = "Checking " + names.length + " photos...";

      function nextPhoto() {
        if (position >= names.length) {
          showResults();
          return;
        }

        var name = names[position];
        position++;

        status.textContent =
          "Checking photo " + position + " of " + names.length + "...";

        checkOne(name, function (success) {
          if (success) {
            loaded.push(name);
          } else {
            failed.push(name);
          }

          nextPhoto();
        });
      }

      function showResults() {
        summary.innerHTML =
          "<h2>Results</h2>" +
          "<p>Total checked: " + names.length + "</p>" +
          '<p class="good">Loaded: ' + loaded.length + "</p>" +
          '<p class="bad">Failed: ' + failed.length + "</p>";

        var output = "<h2 class='good'>Successfully loaded</h2><ul>";

        loaded.forEach(function (name) {
          output += "<li>" + escapeHTML(name) + "</li>";
        });

        output += "</ul><h2 class='bad'>Failed photos</h2><ul>";

        failed.forEach(function (name) {
          output += "<li>" + escapeHTML(name) + "</li>";
        });

        output += "</ul>";

        results.innerHTML = output;
        status.textContent = "Finished checking all photos!";
        button.disabled = false;
      }

      nextPhoto();
    };

    request.onerror = function () {
      status.textContent = "Unable to connect to your website.";
      button.disabled = false;
    };

    request.send();
  };
})();
</script>
</body>
</html>
